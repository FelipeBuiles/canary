# Installed as /etc/nginx/sites-available/canary; CF ranges are generated from
# https://www.cloudflare.com/ips-v4/ and /ips-v6/ into the include below.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name scenewright.ink www.scenewright.ink;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scenewright.ink www.scenewright.ink;
    ssl_certificate /etc/letsencrypt/live/scenewright.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scenewright.ink/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
    # Cloudflare global authenticated origin pulls are enabled for this zone.
    ssl_verify_client on;
    include /etc/nginx/cloudflare-real-ip.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    client_max_body_size 64m;
    access_log /var/log/nginx/canary-access.log canary;
    error_log /var/log/nginx/canary-error.log warn;
    error_page 503 @maintenance;
    location @maintenance {
        default_type text/plain;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 503 "Scenewright is undergoing scheduled maintenance. Please try again shortly.\n";
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        if (-f /var/lib/canary/public-maintenance) { return 503; }
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
