# Local pricing metadata that LiteLLM's model-cost map cannot infer from a
# Canary request alone.
#
# `aliases` map gateway aliases to the provider model configured in
# litellm/config.yaml. Keep these in sync with that file.
# `model_overrides` are last-resort fallbacks for models missing from the cached
# LiteLLM cost map.

aliases:
  extract-fast: vertex_ai/gemini-3.5-flash-lite
  extract-balanced: vertex_ai/gemini-3.6-flash
  extract-quality: vertex_ai/gemini-3.1-pro-preview
  adapt-fast: anthropic/claude-haiku-4-5
  adapt-balanced: anthropic/claude-sonnet-4-6
  adapt-quality: anthropic/claude-opus-4-7
  plan-fast: vertex_ai/gemini-3.5-flash-lite
  plan-balanced: vertex_ai/gemini-3.6-flash
  plan-quality: vertex_ai/gemini-3.6-flash
  prompt-fast: vertex_ai/gemini-3.5-flash-lite
  prompt-balanced: vertex_ai/gemini-3.5-flash-lite
  prompt-quality: vertex_ai/gemini-3.5-flash-lite
  image-fast: vertex_ai/gemini-3.1-flash-lite-image
  image-balanced: vertex_ai/gemini-3.1-flash-lite-image
  image-balanced-seedream-test: bytedance/seedream/v5/lite/edit
  image-reve: reve/create
  image-quality: bytedance/seedream/v5/pro/edit

model_overrides:
  # Reve v2 real cost is ~$0.20/image (measured in production 2026-07; the
  # $0.04 rate was the deprecated v1 API). Kept for image-reve/labs routes.
  reve/create:
    output_cost_per_image: 0.20
    mode: image_generation
  reve/remix:
    output_cost_per_image: 0.20
    mode: image_generation
  reve/layout:
    output_cost_per_image: 0.20
    mode: image_generation
  reve/layout2image:
    output_cost_per_image: 0.20
    mode: image_generation
  reve/text2layout:
    output_cost_per_image: 0.20
    mode: image_generation
  reve/image2layout:
    output_cost_per_image: 0.20
    mode: image_generation
  reve/layout2layout:
    output_cost_per_image: 0.20
    mode: image_generation

  # Google Gemini text models.
  # source:
  # https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing,
  # verified 2026-05-08.
  gemini-2.5-pro:
    input_cost_per_token: 0.00000125
    output_cost_per_token: 0.00001
    mode: chat
  gemini-2.5-flash:
    input_cost_per_token: 0.0000003
    output_cost_per_token: 0.0000025
    mode: chat
  gemini-2.5-flash-lite:
    input_cost_per_token: 0.0000001
    output_cost_per_token: 0.0000004
    mode: chat
  gemini-3.1-pro-preview:
    input_cost_per_token: 0.000002
    output_cost_per_token: 0.000012
    mode: chat
  # Gemini 3.5 Flash — stable frontier-speed model for agentic and coding tasks.
  # source: https://ai.google.dev/gemini-api/docs/pricing,
  # verified 2026-05-24.
  gemini-3.5-flash:
    input_cost_per_token: 0.0000015
    output_cost_per_token: 0.000009
    mode: chat
  # Gemini 3.6 Flash — lower-cost, more token-efficient successor to 3.5 Flash.
  # source: https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/,
  # verified 2026-07-21.
  gemini-3.6-flash:
    input_cost_per_token: 0.0000015
    output_cost_per_token: 0.0000075
    mode: chat
  # Gemini 3 Flash Preview — Pro-level intelligence at Flash speed/price.
  # Note the asymmetric naming: the flash text model is in the `3-` family
  # while flash-lite and pro are in the `3.1-` family.
  # source: https://openrouter.ai/google/gemini-3-flash-preview,
  # verified 2026-05-08.
  gemini-3-flash-preview:
    input_cost_per_token: 0.0000005
    output_cost_per_token: 0.000003
    mode: chat
  gemini-3.1-flash-lite-preview:
    input_cost_per_token: 0.00000025
    output_cost_per_token: 0.0000015
    mode: chat
  gemini-3.1-flash-lite:
    input_cost_per_token: 0.00000025
    output_cost_per_token: 0.0000015
    mode: chat
  # Gemini 3.5 Flash-Lite — high-throughput successor to 3.1 Flash-Lite.
  # source: https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-6-flash-3-5-flash-lite-3-5-flash-cyber/,
  # verified 2026-07-21.
  gemini-3.5-flash-lite:
    input_cost_per_token: 0.0000003
    output_cost_per_token: 0.0000025
    mode: chat
  # Gemini 3.1 Flash Preview — Fast preview model.
  # source: https://cloud.google.com/vertex-ai/generative-ai/pricing,
  # verified 2026-06-14.
  gemini-3.1-flash-preview:
    input_cost_per_token: 0.0000003
    output_cost_per_token: 0.0000025
    mode: chat

  # Anthropic Claude models.
  # source: https://platform.claude.com/docs/en/about-claude/pricing,
  # verified 2026-05-08.
  claude-haiku-4-5:
    input_cost_per_token: 0.000001
    output_cost_per_token: 0.000005
    mode: chat
  claude-sonnet-4-6:
    input_cost_per_token: 0.000003
    output_cost_per_token: 0.000015
    mode: chat
  claude-opus-4-7:
    input_cost_per_token: 0.000005
    output_cost_per_token: 0.000025
    mode: chat

  # OpenAI text models.
  # source: https://openai.com/api/pricing/,
  # verified 2026-05-08.
  gpt-5.4:
    input_cost_per_token: 0.0000025
    output_cost_per_token: 0.000015
    mode: chat
  gpt-5.4-mini:
    input_cost_per_token: 0.00000075
    output_cost_per_token: 0.0000045
    mode: chat

  # GPT-Image-2 has separate text-input, image-input, and image-output rates.
  # `input_cost_per_token` is text input; `image_input_cost_per_token` applies
  # to reference-image tokens in pre-call estimates.
  # sources: https://openai.com/api/pricing/ and
  # https://platform.openai.com/docs/guides/image-generation#cost-and-latency,
  # verified 2026-05-08.
  gpt-image-2:
    input_cost_per_token: 0.000005
    image_input_cost_per_token: 0.000008
    output_cost_per_token: 0.00003
    output_cost_per_image: 0.03168
    image_input_tokens_per_ref: 250
    image_output_tokens_by_quality:
      low: 272
      medium: 1056
      high: 4160
      auto: 1056
    mode: image_generation

  # Gemini image models. `input_cost_per_image` is the cost of one reference
  # image at the documented input-image token count; output cost uses 1K output.
  # sources:
  # https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
  # and https://ai.google.dev/gemini-api/docs/pricing, verified 2026-07-01.
  gemini-3-pro-image-preview:
    input_cost_per_image: 0.00112
    output_cost_per_image: 0.134
    mode: image_generation
  gemini-3.1-flash-image-preview:
    input_cost_per_image: 0.00056
    output_cost_per_image: 0.067
    mode: image_generation
  # Nano Banana 2 Lite (Gemini 3.1 Flash Lite Image) — efficiency specialist,
  # ~half the flash-image price. 1K image output = $30/1M tokens * 1120 tokens
  # = $0.0336; one ref image = 1120 input tokens * $0.25/1M = $0.00028.
  gemini-3.1-flash-lite-image:
    input_cost_per_image: 0.00028
    output_cost_per_image: 0.0336
    mode: image_generation

  # Black Forest Labs / Together image models.
  # sources: https://docs.bfl.ml/quick_start/pricing
  # and https://www.together.ai/pricing, verified 2026-05-08.
  black-forest-labs/FLUX.1-pro:
    output_cost_per_image: 0.04
    mode: image_generation
  black-forest-labs/FLUX.1-kontext-pro:
    output_cost_per_image: 0.04
    mode: image_generation
  black-forest-labs/FLUX.2-kontext-pro:
    output_cost_per_image: 0.03
    mode: image_generation
  black-forest-labs/FLUX.1-dev:
    output_cost_per_image: 0.025
    mode: image_generation
  black-forest-labs/FLUX.1-schnell:
    output_cost_per_image: 0.0027
    mode: image_generation

  # Labs direct-call providers.
  # sources: fal.ai model pages, verified 2026-05-12.
  fal-ai/flux-pro/kontext/max/multi:
    output_cost_per_image: 0.08
    mode: image_generation
  bytedance/seedream/v5/lite/edit:
    # fal.ai model page, verified 2026-07-14.
    output_cost_per_image: 0.035
    mode: image_generation
  bytedance/seedream/v5/pro/edit:
    # Base rate for outputs up to 1536x1536. Additional refs and larger
    # outputs are billed separately by fal.ai.
    output_cost_per_image: 0.0675
    mode: image_generation
  fal-ai/flux-2-pro/edit:
    input_cost_per_megapixel: 0.015
    output_cost_first_megapixel: 0.03
    output_cost_per_extra_megapixel: 0.015
    mode: image_generation
  fal-ai/recraft/v4/text-to-image:
    output_cost_per_image: 0.04
    mode: image_generation
  fal-ai/nano-banana-2/edit:
    output_cost_per_image: 0.08
    mode: image_generation
  fal-ai/z-image/turbo:
    output_cost_per_image: 0.008
    mode: image_generation
  fal-ai/flux-2-klein:
    output_cost_per_image: 0.015
    mode: image_generation
