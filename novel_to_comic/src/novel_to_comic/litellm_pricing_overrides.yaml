# Active API routes and API-equivalent rates for local subscription models.
# Current selectable rates are checked against provider model pages.
# GPT Image 2.5 estimated_* fields are reservation allowances, not tariffs;
# expected_* fields settle completed requests whose provider charge is unreported.
aliases:
  ocr-textract: textract/detect-document-text
  image-nano-banana-2.1: vertex_ai/gemini-nano-banana-2.1
  gpt-6.1-sol: openai/gpt-6.1-sol
  gpt-6-sol: openai/gpt-6-sol
  gpt-6-luna: openai/gpt-6-luna
  gemini-3.8-flash: vertex_ai/gemini-3.8-flash
  gemini-4-carbon: vertex_ai/gemini-4-carbon
  gemini-4-hydrogen: vertex_ai/gemini-4-hydrogen
  claude-opus-5-5: anthropic/claude-opus-5-5
  claude-sonnet-5-5: anthropic/claude-sonnet-5-5
  claude-haiku-5-5: anthropic/claude-haiku-5-5
  bedrock-claude-opus-5-5: bedrock/converse/global.anthropic.claude-opus-5-5
  bedrock-claude-sonnet-5-5: bedrock/converse/global.anthropic.claude-sonnet-5-5
  bedrock-claude-haiku-5-5: bedrock/converse/global.anthropic.claude-haiku-5-5
  deepseek-v4.1-flash: together_ai/deepseek-ai/DeepSeek-V4.1-Flash
  mimo-v2.6-pro: openrouter/xiaomi/mimo-v2.6-pro
  runware-gemini-4-argon: runware-text/google-gemini-4-argon
  runware-deepseek-v4.1-flash-1017: runware-text/deepseek-v4-1-flash-1017
  runware-gpt-6.1-terra: runware-text/openai-gpt-6-1-terra
  image-sunburst: openai/gpt-image-2.5/sunburst
  image-sunburst-openai: openai/gpt-image-2.5-sunburst
  image-flare: openai/gpt-image-2.5-flare
  image-sunburst-runware: runware/gpt-image-2.5-sunburst
  image-flare-runware: runware/gpt-image-2.5-flare
  image-sunburst-2.6: openai/gpt-image-2.6-sunburst
  image-flare-2.6: openai/gpt-image-2.6-flare
  image-sunburst-2.6-runware: runware/gpt-image-2.6-sunburst
  image-flare-2.6-runware: runware/gpt-image-2.6-flare
  image-minimax-h3-runware: runware/minimax-h3-image
  image-minimax-h3-highspeed-runware: runware/minimax-h3-image-highspeed
model_overrides:
  # N. Virginia DetectDocumentText, first 1M monthly images; verified 2026-10-07.
  # Conservative list-price accounting; discounts/credits are separate offsets.
  textract/detect-document-text:
    output_cost_per_document_page: 0.0015
    mode: ocr
  # https://cloud.google.com/vertex-ai/generative-ai/pricing (2026-10-06).
  # Reservation includes text/reasoning headroom; actual Vertex usage settles separately.
  gemini-nano-banana-2.1:
    input_cost_per_token: 1.5e-06
    image_input_cost_per_token: 1.5e-06
    output_cost_per_token: 3.0e-05
    text_output_cost_per_token: 7.5e-06
    cache_read_input_token_cost: 1.5e-07
    mode: image_generation
    estimated_output_cost_per_image: 0.15
    estimated_input_cost_per_reference: 0.00168
  # https://cloud.google.com/vertex-ai/generative-ai/pricing (2026-10-02).
  # Global introductory USD rates through 2026-12-31; review before 2027.
  # Bare key also covers the model name Vertex returns in usage responses.
  gemini-3.8-flash:
    input_cost_per_token: 7.5e-07
    cache_read_input_token_cost: 7.5e-08
    output_cost_per_token: 3.75e-06
    output_cost_per_reasoning_token: 3.75e-06
    mode: chat
    max_input_tokens: 1048576
    max_output_tokens: 65536
  # Argon's provisional launch rates (operator-approved 2026-10-13), kept for
  # Carbon on the operator's 2026-11-10 statement that it costs the same. Not a
  # verified Vertex tariff. Cache availability/storage and intro expiry unconfirmed.
  # https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/
  # Post-intro announced rates: $4/M input, $20/M output. Review before use.
  gemini-4-carbon:
    input_cost_per_token: 2.0e-06
    cache_read_input_token_cost: 1.0e-07
    output_cost_per_token: 1.0e-05
    mode: chat
  # Google launch rates (2026-11-12), flat across the context window; no Vertex
  # pricing page entry yet. Cache storage charges unconfirmed.
  # https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/
  gemini-4-hydrogen:
    input_cost_per_token: 1.5e-06
    cache_read_input_token_cost: 7.5e-08
    output_cost_per_token: 7.5e-06
    mode: chat
  # https://developers.openai.com/api/docs/models/gpt-6.1-sol (2026-09-29)
  # Shared by the production API route and Labs Codex subscription usage.
  gpt-6.1-sol:
    input_cost_per_token: 2.0e-06
    cache_read_input_token_cost: 1.0e-07
    output_cost_per_token: 1.0e-05
    input_cost_per_token_above_272k_tokens: 4.0e-06
    cache_read_input_token_cost_above_272k_tokens: 2.0e-07
    output_cost_per_token_above_272k_tokens: 1.5e-05
    mode: chat
    max_input_tokens: 1050000
    max_output_tokens: 128000
  # https://developers.openai.com/api/docs/models/gpt-6-sol (2026-09-22)
  gpt-6-sol:
    input_cost_per_token: 2.0e-06
    cache_read_input_token_cost: 2.0e-07
    output_cost_per_token: 1.0e-05
    mode: chat
    max_input_tokens: 1050000
    max_output_tokens: 128000
  # https://developers.openai.com/api/docs/models/gpt-6-luna (2026-09-22)
  gpt-6-luna:
    input_cost_per_token: 1.0e-07
    cache_read_input_token_cost: 1.0e-08
    output_cost_per_token: 5.0e-07
    mode: chat
    max_input_tokens: 1050000
    max_output_tokens: 128000
  # https://platform.claude.com/docs/en/about-claude/pricing (2026-09-25).
  # Not yet in the cached LiteLLM map. Unprefixed key also covers the
  # provider model returned in usage responses.
  claude-opus-5-5:
    input_cost_per_token: 4.0e-06
    cache_read_input_token_cost: 2.0e-07
    cache_creation_input_token_cost: 5.0e-06
    output_cost_per_token: 2.0e-05
    mode: chat
    max_input_tokens: 1000000
    max_output_tokens: 128000
  # https://platform.claude.com/docs/en/models/sonnet-5-5/overview (2026-09-28).
  # Not yet in the cached LiteLLM map. Cache creation is the 5-minute write rate.
  claude-sonnet-5-5:
    input_cost_per_token: 2.0e-06
    cache_read_input_token_cost: 2.0e-07
    cache_creation_input_token_cost: 2.5e-06
    output_cost_per_token: 1.0e-05
    mode: chat
    max_input_tokens: 1000000
    max_output_tokens: 128000
  # Global Bedrock profiles use standard base rates (2026-10-03).
  # https://platform.claude.com/docs/en/about-claude/pricing
  # https://docs.litellm.ai/blog/claude_sonnet_5_5
  # Include the gateway's Converse model name and Bedrock's returned profile ID.
  global.anthropic.claude-opus-5-5: &bedrock_opus_5_5
    input_cost_per_token: 4.0e-06
    cache_read_input_token_cost: 2.0e-07
    cache_creation_input_token_cost: 5.0e-06
    output_cost_per_token: 2.0e-05
    mode: chat
    max_input_tokens: 1000000
    max_output_tokens: 128000
  bedrock/converse/global.anthropic.claude-opus-5-5: *bedrock_opus_5_5
  converse/global.anthropic.claude-opus-5-5: *bedrock_opus_5_5
  global.anthropic.claude-sonnet-5-5: &bedrock_sonnet_5_5
    input_cost_per_token: 2.0e-06
    cache_read_input_token_cost: 2.0e-07
    cache_creation_input_token_cost: 2.5e-06
    output_cost_per_token: 1.0e-05
    mode: chat
    max_input_tokens: 1000000
    max_output_tokens: 128000
  bedrock/converse/global.anthropic.claude-sonnet-5-5: *bedrock_sonnet_5_5
  converse/global.anthropic.claude-sonnet-5-5: *bedrock_sonnet_5_5
  openrouter/xiaomi/mimo-v2.6-pro:
    input_cost_per_token: 4.35e-07
    output_cost_per_token: 8.7e-07
    cache_read_input_token_cost: 3.6e-09
    mode: chat
    max_input_tokens: 1048576
    max_output_tokens: 131072
  # Runware text catalog rates (GET /v1/models, model pages; 2026-10-27).
  # Responses report no cost; usage includes thinking (litellm_handlers/runware_text.py).
  runware-text/google-gemini-4-argon:
    input_cost_per_token: 2.0e-06
    cache_read_input_token_cost: 1.0e-07
    output_cost_per_token: 1.0e-05
    mode: chat
    max_input_tokens: 1048576
    max_output_tokens: 32768
  runware-text/deepseek-v4-1-flash-1017:
    input_cost_per_token: 1.5e-07
    cache_read_input_token_cost: 1.0e-08
    output_cost_per_token: 6.0e-07
    mode: chat
    max_input_tokens: 1048576
    max_output_tokens: 1048576
  runware-text/openai-gpt-6-1-terra:
    input_cost_per_token: 1.0e-06
    cache_read_input_token_cost: 5.0e-08
    output_cost_per_token: 5.0e-06
    input_cost_per_token_above_272k_tokens: 2.0e-06
    cache_read_input_token_cost_above_272k_tokens: 1.0e-07
    output_cost_per_token_above_272k_tokens: 7.5e-06
    mode: chat
    max_input_tokens: 1050000
    max_output_tokens: 128000
  # https://www.together.ai/models/deepseek-v4-1-flash (verified 2026-09-24).
  # Unprefixed key also covers the provider model returned in usage responses.
  deepseek-ai/DeepSeek-V4.1-Flash:
    input_cost_per_token: 3.0e-07
    cache_read_input_token_cost: 6.0e-09
    output_cost_per_token: 1.2e-06
    mode: chat
    max_input_tokens: 1048576
    max_output_tokens: 384000
  # https://developers.openai.com/api/docs/models/gpt-image-2.5-flare (2026-10-03).
  # Flare has its own usage, not Sunburst's measured consumption. Until measured,
  # estimates use conservative allowances; completed calls use returned tokens.
  gpt-image-2.5-flare:
    # Three streamed previews, 100 billed image output tokens each.
    estimated_preview_output_tokens: 300
    expected_preview_output_tokens: 300
    input_cost_per_token: 5.0e-06
    image_input_cost_per_token: 8.0e-06
    cached_text_input_cost_per_token: 1.25e-06
    cached_image_input_cost_per_token: 2.0e-06
    output_cost_per_token: 3.0e-05
    mode: image_generation
    estimated_output_cost_per_image: 0.25
    estimated_input_cost_per_reference: 0.01
  # GPT Image 2.6 (2026-11-04): OpenAI publishes the same token rates as 2.5,
  # but CellCog (2026-11-05, 1024x1024) measured 4.2x the output tokens at low
  # and 3.3x at medium; high and above matched 2.5 exactly. Labs-only routes;
  # unmeasured here, so estimates use the allowance and settle on returned tokens.
  gpt-image-2.6-flare: &gpt_image_2_6
    estimated_preview_output_tokens: 300
    expected_preview_output_tokens: 300
    input_cost_per_token: 5.0e-06
    image_input_cost_per_token: 8.0e-06
    cached_text_input_cost_per_token: 1.25e-06
    cached_image_input_cost_per_token: 2.0e-06
    output_cost_per_token: 3.0e-05
    mode: image_generation
    estimated_output_cost_per_image: 0.25
    estimated_input_cost_per_reference: 0.01
  gpt-image-2.6-sunburst: *gpt_image_2_6
  gpt-image-2.5-sunburst:
    estimated_preview_output_tokens: 300
    expected_preview_output_tokens: 300
    input_cost_per_token: 5.0e-06
    image_input_cost_per_token: 8.0e-06
    cached_text_input_cost_per_token: 1.25e-06
    cached_image_input_cost_per_token: 2.0e-06
    output_cost_per_token: 3.0e-05
    mode: image_generation
    estimated_output_cost_per_image: 0.25
    estimated_input_cost_per_reference: 0.01
    # 2026-09-12 project 47ce4ed9: 29 completed medium-quality images.
    # Observed output tokens: 378 portrait, 439 square, 255 landscape.
    # Rounded upward with ~25% consumption headroom; other settings keep $0.25.
    # References consumed 1008–1536 tokens; allow 2000 without assuming caching.
    estimated_input_tokens_per_reference: 2000
    estimated_image_tokens_by_quality_and_size:
      # 2026-09-12 project a16e7aae: three high-quality 1024x1536 pages,
      # each 1372 output tokens. Allow 1750 (~28% headroom); do not apply
      # these observations to other sizes/qualities.
      high:
        1024x1536: 1750
      medium:
        # FAL publishes $0.01029 (343 tokens) for medium 1024x1536; ~25% headroom.
        1024x1536: 430
        # Cover. FAL publishes $0.00903 (301 tokens) for medium 1024x768;
        # portrait assumed equal. ~25% headroom.
        768x1024: 380
        1024x1280: 480
        1024x1024: 550
        1344x768: 320
        1536x1024: 320
    # Settlement estimate for a completed request whose provider charge is not
    # reported (no FAL billing event). Central observations, never headroom:
    # quotes reserve with the estimated_* fields above; charges use these.
    # 2026-09-22 FAL billing for four medium pages (2–5 references) fits
    # ~1200 image-input tokens per reference.
    expected_input_tokens_per_reference: 1200
    expected_image_tokens_by_quality_and_size:
      high:
        1024x1536: 1372
      medium:
        1024x1536: 343
        768x1024: 301
        1024x1280: 378
        1024x1024: 439
        1344x768: 255
        1536x1024: 255
  openai/gpt-image-2.5/sunburst:
    # The selectable route tries OpenAI with previews first. FAL itself has
    # no previews: its expected-charge estimate retains only its final image.
    estimated_preview_output_tokens: 300
    input_cost_per_token: 5.0e-06
    image_input_cost_per_token: 8.0e-06
    cached_text_input_cost_per_token: 1.25e-06
    cached_image_input_cost_per_token: 2.0e-06
    output_cost_per_token: 3.0e-05
    mode: image_generation
    estimated_output_cost_per_image: 0.25
    estimated_input_cost_per_reference: 0.01
    estimated_input_tokens_per_reference: 2000
    estimated_image_tokens_by_quality_and_size:
      high:
        1024x1536: 1750
      medium:
        1024x1536: 430
        768x1024: 380
        1024x1280: 480
        1024x1024: 550
        1344x768: 320
        1536x1024: 320
    expected_input_tokens_per_reference: 1200
    expected_image_tokens_by_quality_and_size:
      high:
        1024x1536: 1372
      medium:
        1024x1536: 343
        768x1024: 301
        1024x1280: 378
        1024x1024: 439
        1344x768: 255
        1536x1024: 255

  # Runware reports each task's charged cost, which settles the call; these
  # estimates reserve credits and cover a result without a reported cost.
  # Runware returns no token usage. Its charges (2026-10-23 Labs runs) imply
  # ~630-670 input tokens per page reference and ~1,000-1,270 for a lone
  # Style/Cast reference, so the expected figure sits between them. The
  # reservation keeps 2,000: a lone reference already costs up to its hold. Output tables are FAL's measurements.
  # Runware charged Flare exactly what it charged Sunburst on every item, so
  # both share this rate card.
  runware/gpt-image-2.5-sunburst: &runware_gpt_image_2_5
    input_cost_per_token: 5.0e-06
    image_input_cost_per_token: 8.0e-06
    cached_text_input_cost_per_token: 1.25e-06
    cached_image_input_cost_per_token: 2.0e-06
    output_cost_per_token: 3.0e-05
    mode: image_generation
    estimated_output_cost_per_image: 0.25
    estimated_input_cost_per_reference: 0.01
    estimated_input_tokens_per_reference: 2000
    estimated_image_tokens_by_quality_and_size:
      high:
        1024x1536: 1750
      medium:
        1024x1536: 430
        768x1024: 380
        1024x1280: 480
        1024x1024: 550
        1344x768: 320
        1536x1024: 320
    expected_input_tokens_per_reference: 900
    expected_image_tokens_by_quality_and_size:
      high:
        1024x1536: 1372
      medium:
        1024x1536: 343
        768x1024: 301
        1024x1280: 378
        1024x1024: 439
        1344x768: 255
        1536x1024: 255
  runware/gpt-image-2.5-flare: *runware_gpt_image_2_5
  # Runware reports each task's charged cost; estimates use the 2.6 allowance,
  # since 2.5's measured token tables do not apply to 2.6.
  runware/gpt-image-2.6-sunburst: *gpt_image_2_6
  runware/gpt-image-2.6-flare: *gpt_image_2_6
  # MiniMax H3 Image (Runware model page, 2026-11-10): billed per token at
  # $2.30/M text in, $1.50/M image in, $3.80/M image out. Outputs up to ~4 MP
  # use ~4,100 image tokens; each reference ~2,050 input tokens; the rewritten
  # prompt counts as text input. Runware reports the charged cost, which
  # settles the call; the allowances reserve credits before it.
  runware/minimax-h3-image:
    input_cost_per_token: 2.3e-06
    image_input_cost_per_token: 1.5e-06
    output_cost_per_token: 3.8e-06
    mode: image_generation
    estimated_output_cost_per_image: 0.03
    estimated_input_cost_per_reference: 0.004
  # Highspeed: the same model and limits at twice the image token rates.
  runware/minimax-h3-image-highspeed:
    input_cost_per_token: 2.3e-06
    image_input_cost_per_token: 3.0e-06
    output_cost_per_token: 7.6e-06
    mode: image_generation
    estimated_output_cost_per_image: 0.05
    estimated_input_cost_per_reference: 0.007

  # https://platform.claude.com/docs/en/models/haiku-5-5/overview (2026-10-07).
  claude-haiku-5-5: &haiku_5_5
    input_cost_per_token: 1.0e-07
    output_cost_per_token: 5.0e-07
    cache_read_input_token_cost: 1.0e-08
    cache_creation_input_token_cost: 1.25e-07
    input_cost_per_token_above_100k_tokens: 5.0e-07
    output_cost_per_token_above_100k_tokens: 2.5e-06
    cache_read_input_token_cost_above_100k_tokens: 5.0e-08
    cache_creation_input_token_cost_above_100k_tokens: 6.25e-07
    mode: chat
    max_input_tokens: 1000000
    max_output_tokens: 128000
  global.anthropic.claude-haiku-5-5: *haiku_5_5
  bedrock/converse/global.anthropic.claude-haiku-5-5: *haiku_5_5
  converse/global.anthropic.claude-haiku-5-5: *haiku_5_5
