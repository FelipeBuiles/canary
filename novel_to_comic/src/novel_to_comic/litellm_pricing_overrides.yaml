# Local pricing metadata that LiteLLM's model-cost map cannot infer from a
# Canary request alone.
#
# `aliases` map gateway aliases to the provider model configured in
# litellm/config.yaml. Keep these in sync with that file.
# `model_overrides` are last-resort fallbacks for models missing from the cached
# LiteLLM cost map.

aliases:
  extract-fast: vertex_ai/gemini-3.1-flash-lite-preview
  extract-balanced: vertex_ai/gemini-3.1-flash-preview
  extract-quality: vertex_ai/gemini-3.1-pro-preview
  screenplay-fast: anthropic/claude-haiku-4-5
  screenplay-balanced: anthropic/claude-sonnet-4-6
  screenplay-quality: anthropic/claude-opus-4-7
  panel-fast: vertex_ai/gemini-3.1-flash-lite-preview
  panel-balanced: openai/gpt-5.4-mini
  panel-quality: openai/gpt-5.4
  prompt-fast: vertex_ai/gemini-3.1-flash-lite-preview
  prompt-balanced: vertex_ai/gemini-3.1-flash-lite-preview
  prompt-quality: vertex_ai/gemini-3.1-flash-lite-preview
  image-fast: vertex_ai/gemini-3.1-flash-image-preview
  image-balanced: openai/gpt-image-2
  image-quality: vertex_ai/gemini-3-pro-image-preview

model_overrides:
  # For token-priced image models, the cached `input_cost_per_token` and
  # `output_cost_per_token` drive the math. We just need to know how many tokens
  # a reference image and a generated image of each quality consume.
  #
  # Sources for the gpt-image-2 numbers below: OpenAI's published gpt-image-1
  # token figures (square 1024x1024) — gpt-image-2 reuses the same accounting.
  # Re-tune these after sampling actual usage rows if estimates drift.
  gpt-image-2:
    image_input_tokens_per_ref: 250
    image_output_tokens_by_quality:
      low: 272
      medium: 1056
      high: 4160
      auto: 1056

  # input_cost_per_image: per-reference-image cost added to edit/generation calls
  # for models priced per-image (no token pricing). Derived from observed
  # provider costs; re-verify after each model pricing update.
  gemini-3-pro-image-preview:
    input_cost_per_image: 0.007
  gemini-3.1-flash-image-preview:
    input_cost_per_image: 0.0125

  # Models missing from the cached LiteLLM cost map
  gemini-2.5-pro:
    input_cost_per_token: 0.00000125
    output_cost_per_token: 0.00001
    mode: chat
  gemini-2.5-flash:
    input_cost_per_token: 0.0000003
    output_cost_per_token: 0.0000025
    mode: chat
  gemini-2.5-flash-lite:
    input_cost_per_token: 0.0000001
    output_cost_per_token: 0.0000004
    mode: chat
  gemini-3.1-flash-preview:
    input_cost_per_token: 0.0000003
    output_cost_per_token: 0.0000025
    mode: chat
  claude-haiku-4-5:
    input_cost_per_token: 0.000001
    output_cost_per_token: 0.000005
    mode: chat
  claude-opus-4-7:
    input_cost_per_token: 0.000015
    output_cost_per_token: 0.000075
    mode: chat
  gpt-5.4:
    input_cost_per_token: 0.0000025
    output_cost_per_token: 0.000015
    mode: chat
  black-forest-labs/FLUX.1-pro:
    output_cost_per_image: 0.055
    mode: image_generation
  black-forest-labs/FLUX.1-kontext-pro:
    output_cost_per_image: 0.055
    mode: image_generation
  black-forest-labs/FLUX.2-kontext-pro:
    output_cost_per_image: 0.075
    mode: image_generation
  black-forest-labs/FLUX.1-dev:
    output_cost_per_image: 0.025
    mode: image_generation
  black-forest-labs/FLUX.1-schnell:
    output_cost_per_image: 0.006
    mode: image_generation
