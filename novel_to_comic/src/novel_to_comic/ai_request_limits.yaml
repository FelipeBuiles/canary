# Operator admission budgets, separate from credit estimates and provider billing.
# Shared by the single-owner API process, including its worker event loops.
pools:
  images: 12
  # Runware recommends 2-4 concurrent requests per model (docs, 2026-10-23).
  runware_images: 4
  vertex_text: 16
  # Runware publishes no text rate limits; Plan and Adapt fan out shards.
  runware_text: 8
budgets:
  openai_images:
    aliases: [image-sunburst-openai, image-flare]
    pool: images
    # Conservatively share the allowance across both OpenAI image models and endpoints.
    requests_per_minute: 18
    burst_requests: 6
    tokens_per_minute: 225000
    output_weight: 1
    image_input_tokens: 2048
    image_output_tokens:
      low: 2048
      medium: 4096
      high: 8192
      xhigh: 12288
      max: 16384
      auto: 8192
  runware_images:
    aliases: [image-sunburst-runware, image-flare-runware]
    pool: runware_images
    # Upstream OpenAI capacity sits behind Runware; keep the direct allowance.
    requests_per_minute: 18
    burst_requests: 6
    tokens_per_minute: 225000
    output_weight: 1
    image_input_tokens: 2048
    image_output_tokens:
      low: 2048
      medium: 4096
      high: 8192
      xhigh: 12288
      max: 16384
      auto: 8192
  vertex_text:
    provider: vertex_ai
    pool: vertex_text
    per_model: true
    tokens_per_minute: 1800000
    burst_tokens: 450000
    output_weight: 5
    image_input_tokens: 1120
    estimated_output_tokens: 8192
    output_tokens_by_feature:
      plan.detail: 18000
      adapt.blueprint: 6000
      adapt.lettering: 4096
      plan.narrative_review: 512
      adapt.narrative_review: 512
  runware_text:
    provider: runware
    pool: runware_text
    per_model: true
    # No published minute allowance: concurrency and shared 429 cooldowns
    # only. The text estimator still sizes each call.
    output_weight: 1
    image_input_tokens: 1120
    estimated_output_tokens: 8192
