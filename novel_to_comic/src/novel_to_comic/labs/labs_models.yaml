# Curated list of image models exposed in the Labs experimentation page.
# Adding a new entry here makes it appear in the labs UI.
#
# Fields:
#   id            Stable identifier referenced from the frontend and saved runs.
#   label         Human-readable name shown in the UI.
#   provider      One of: fal, together, litellm.
#   endpoint      Provider-specific endpoint or model alias.
#   tier          fast | balanced | premium  (used for grouping in the picker)
#   multi_ref     True if the endpoint accepts multiple reference images.
#   max_refs      Cap on number of reference images sent to the provider.
#   style_refs    True if it accepts style references (separate from subject refs).
#   approx_cost   Indicative USD per 1024px image (display only — actual cost
#                 comes from the provider response when available).
#   notes         Free-form note shown as a tooltip in the picker.
#   enabled       Set to false to hide without removing the entry.
#   params        Optional dict of provider-specific defaults merged into each call.

models:
  # ── New candidates (fal.ai) ───────────────────────────────────────────────
  - id: flux-kontext-max-multi
    label: "FLUX Kontext Max (multi-ref)"
    provider: fal
    endpoint: fal-ai/flux-pro/kontext/max/multi
    tier: premium
    multi_ref: true
    max_refs: 4
    approx_cost: 0.08
    notes: >-
      Best-in-class character consistency across panels. Experimental on fal —
      schema may change. Falls back to Seedream 5.0 Lite Edit if unavailable.

  - id: seedream-v5-lite-edit
    label: "Seedream 5.0 Lite Edit"
    provider: fal
    endpoint: bytedance/seedream/v5/lite/edit
    tier: balanced
    multi_ref: true
    max_refs: 10
    approx_cost: 0.035
    notes: >-
      Fast Seedream 5.0 editor with up to 10 reference images and 2K/3K/4K
      output presets. Balanced-tier candidate for character and style fidelity.

  - id: seedream-v5-pro-edit
    label: "Seedream 5.0 Pro Edit"
    provider: fal
    endpoint: bytedance/seedream/v5/pro/edit
    tier: premium
    multi_ref: true
    max_refs: 10
    approx_cost: 0.0675
    notes: >-
      Flagship Seedream 5.0 editor for grounded, region-precise changes and up
      to 10 references. Base price is ~$0.0675 at up to 1536px, plus $0.0045
      for each reference after the first; larger outputs cost more.

  - id: flux-2-pro-edit
    label: "FLUX.2 Pro Edit"
    provider: fal
    endpoint: fal-ai/flux-2-pro/edit
    tier: premium
    multi_ref: true
    max_refs: 9
    approx_cost: 0.03
    notes: >-
      Clean replacement for gpt-image-2 — no dappled-texture bug. Pricing is
      per megapixel, so 4MP outputs cost ~$0.075.

  - id: recraft-v4
    label: "Recraft V4"
    provider: fal
    endpoint: fal-ai/recraft/v4/text-to-image
    tier: balanced
    multi_ref: false
    style_refs: true
    approx_cost: 0.04
    notes: >-
      Best illustrative aesthetic and palette lock out of the box. No
      multi-image character ref endpoint on fal as of 2026-05 — use style-only.

  - id: nano-banana-2-edit
    label: "Nano Banana 2 (edit)"
    provider: fal
    endpoint: fal-ai/nano-banana-2/edit
    tier: fast
    multi_ref: true
    max_refs: 14
    approx_cost: 0.08
    notes: >-
      Fast with 14-image conditioning. Useful baseline against the
      gemini-3-flash-image you currently use (same family, more refs).

  - id: z-image-turbo
    label: "Z-Image Turbo"
    provider: fal
    endpoint: fal-ai/z-image/turbo
    tier: fast
    multi_ref: true
    max_refs: 4
    approx_cost: 0.008
    notes: >-
      Cheapest strong draft candidate. ~1-2s latency with multi-image
      composition support. Reviewers rate it well above FLUX Schnell —
      candidate to replace Schnell as the draft tier pending visual eval.

  - id: flux-2-klein
    label: "FLUX.2 Klein"
    provider: fal
    endpoint: fal-ai/flux-2-klein
    tier: fast
    multi_ref: true
    max_refs: 4
    approx_cost: 0.015
    notes: >-
      Sub-second distilled FLUX.2, up to 4 reference images, license-free.
      Endpoint slug follows this file's flux-2-pro hyphenation convention but
      is NOT verified against the live fal catalog — if fal rejects it, try
      fal-ai/flux-2/klein.

  # ── New candidates (together.ai) ──────────────────────────────────────────
  - id: flux-1-schnell-together
    label: "FLUX.1 Schnell"
    provider: together
    endpoint: black-forest-labs/FLUX.1-schnell
    tier: fast
    multi_ref: false
    approx_cost: 0.003
    notes: >-
      Bargain draft tier. 1-4 step model. No reference support — text-to-image
      only.

  # ── Production Gemini models (native Vertex multimodal path) ─────────────────
  - id: gemini-flash-lite-production-fast
    label: "Gemini 3.1 Flash Lite Image (production fast)"
    provider: litellm
    endpoint: image-fast
    tier: fast
    multi_ref: true
    max_refs: 8
    approx_cost: 0.034
    notes: >-
      Production image-fast tier. Gemini 3.1 Flash Lite Image routed through the
      vertex-multimodal custom provider — native Vertex multimodal shape,
      role-labeled reference images.

  - id: gemini-flash-lite-production-balanced
    label: "Gemini 3.1 Flash Lite Image (production balanced)"
    provider: litellm
    endpoint: image-balanced
    tier: balanced
    multi_ref: true
    max_refs: 8
    approx_cost: 0.034
    notes: >-
      Production image-balanced tier. Gemini 3 Pro Image (Nano Banana Pro) routed through the
      vertex-multimodal custom provider — native Vertex multimodal shape,
      role-labeled reference images.

  - id: seedream-v5-lite-litellm-proxy
    label: "Seedream 5.0 Lite (LiteLLM proxy)"
    provider: litellm
    endpoint: image-balanced-seedream-test
    tier: balanced
    multi_ref: true
    max_refs: 10
    approx_cost: 0.035
    notes: >-
      Seedream routed through the local LiteLLM proxy test alias. Use this to
      verify the fal queue routing preserves multi-reference conditioning
      before promoting image-balanced.

  - id: seedream-v5-pro-production-quality
    label: "Seedream 5.0 Pro (production quality)"
    provider: litellm
    endpoint: image-quality
    tier: premium
    multi_ref: true
    max_refs: 10
    approx_cost: 0.0675
    notes: >-
      Production image-quality tier. Seedream 5.0 Pro routed through the local
      LiteLLM gateway with up to 10 role-labeled reference images.

  - id: reve-proxy
    label: "Reve (LiteLLM Proxy)"
    provider: litellm
    endpoint: image-reve
    tier: premium
    multi_ref: true
    max_refs: 4
    style_refs: true
    approx_cost: 0.20
    notes: >-
      Reve model routed through the local LiteLLM proxy gateway.
      Uses custom handler litellm_handlers.reve_provider.

  - id: reve-direct
    label: "Reve (Direct API Call)"
    provider: reve
    endpoint: reve/create
    tier: premium
    multi_ref: true
    max_refs: 4
    style_refs: true
    approx_cost: 0.20
    notes: >-
      Reve model calling the api.reve.com endpoints directly from the Canary
      backend, bypassing the LiteLLM proxy.
