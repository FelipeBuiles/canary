# Canary model pricing table — USD per 1M input/output tokens, or per image.
#
# last_updated: update this whenever you verify or change any price.
# The server logs a warning if today is more than 30 days past this date.
#
# Token-billed models: set input_per_m / output_per_m.
# Per-image models: set per_image_usd (used when no token data is available).
# OpenAI image models: token-billed; per_image_usd kept as a pre-call estimate.
#
# Sources to re-verify prices:
#   Google: https://ai.google.dev/pricing  /  cloud.google.com/vertex-ai/generative-ai/pricing
#   Anthropic: https://www.anthropic.com/pricing
#   OpenAI: https://openai.com/api/pricing
#   Together AI: https://www.together.ai/pricing
#   OpenRouter: https://openrouter.ai/models (per model page)
#
# Unknown models return cost = 0.0 (charge is not tracked).
# Run `pipeline check-pricing` to see which configured models are missing.

last_updated: "2026-04-27"

