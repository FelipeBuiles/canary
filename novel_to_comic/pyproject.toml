[project]
name = "novel-to-comic"
version = "0.1.0"
description = "An 8-stage pipeline that converts novels into graphic novels"
requires-python = ">=3.12"

dependencies = [
  "click>=8.5.0,<9",
  "pydantic>=2.13.5,<3",
  "pyyaml>=6.0.3,<7",
  "httpx>=0.28.1,<0.29",
  "PyJWT[crypto]>=2.15.0,<3",
  "supabase>=2.31.0,<3",
  "boto3>=1.43.98,<2",
  "stripe>=15.6.1,<16",
  "ebooklib>=0.20,<0.21",
  "Pillow>=12.3.0,<13",
  "img2pdf>=0.6.3,<0.7",
  "playwright>=1.63.0,<2",
  "rich>=15.0.0,<16",
  "tenacity>=9.1.4,<10",
  "python-dotenv>=1.2.3,<2",
  "python-multipart>=0.0.32,<0.1",
  "pypdf>=6.19.0,<7",
  "qrcode>=8.2,<9",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn[standard]>=0.53.0,<0.54",
  "slowapi>=0.1.10,<0.2",
  "posthog>=7.58.0,<8",
  "opentelemetry-api>=1.44.0,<2",
  "opentelemetry-sdk>=1.44.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
  "procrastinate>=3.8,<4",
  "psycopg[binary]>=3.3,<4",
]
dev = ["pytest>=9.1.1,<10", "ruff>=0.16.8,<0.17"]


[project.scripts]
pipeline = "novel_to_comic.cli:cli"
canary-mock-models = "novel_to_comic.mock_models:main"

[build-system]
requires = ["setuptools>=84.0.0,<85"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Scope collection to the tests/ dir. Manual smoke-test scripts under scripts/
# (e.g. test_vertex_native.py) require optional extras (google-genai) and aren't
# part of the unit suite — collecting them breaks CI on a clean checkout.
testpaths = ["tests"]
# Gateway handler contracts (root litellm_handlers/) are tested here too.
pythonpath = [".."]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"novel_to_comic" = [
  "prompts/*.txt",
  "fonts/*.ttf", "lettering/*.mjs", "lettering/*.mts",
  "litellm_pricing_overrides.yaml",
  "litellm_model_prices.cached.json",
  "sample_stories/*.json", "sample_stories/*.txt",
]

[tool.pyright]
# Point Pyright at the project venv so third-party deps (fastapi, httpx,
# slowapi, posthog, supabase, …) resolve instead of reporting
# "reportMissingImports". The packages are installed; the type checker just
# needs to know which environment to read them from.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Preserve the pre-upgrade lint gate rather than silently adopting Ruff's
# expanded defaults. Broader style/security rules need a separate migration.
select = ["E4", "E7", "E9", "F"]
