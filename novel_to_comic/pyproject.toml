[project]
name = "novel-to-comic"
version = "0.1.0"
description = "A 9-stage pipeline that converts novels into graphic novels"
requires-python = ">=3.12"

dependencies = [
  "click>=8.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "supabase>=2.0",
  "boto3>=1.34",
  "stripe>=8.0",
  "ebooklib>=0.18",
  "Pillow>=10.0",
  "img2pdf>=0.5",
  "playwright>=1.40",
  "rich>=13.0",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.26",
  "pypdf>=6.10.2",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "slowapi>=0.1.9",
  "sentry-sdk[fastapi]>=2.0",
]
dev = ["pytest", "ruff"]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.scripts]
pipeline = "novel_to_comic.cli:cli"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"novel_to_comic" = [
  "prompts/*.txt",
  "fonts/*.ttf",
  "labs/*.yaml",
  "labs/fixtures/*.json",
  "labs/fixtures/reference_images/*.png",
  "litellm_pricing_overrides.yaml",
  "litellm_model_prices.cached.json",
]

[tool.pyright]
# Point Pyright at the project venv so third-party deps (fastapi, httpx,
# slowapi, sentry-sdk, supabase, …) resolve instead of reporting
# "reportMissingImports". The packages are installed; the type checker just
# needs to know which environment to read them from.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
