# fly.toml app configuration file generated for canary-web on 2026-07-05T15:38:00-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'canary-web'
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  AI_BILL_FAILED_REQUESTS = 'provider_usage_only'
  CANARY_ALLOWED_HOSTS = 'canary-web.fly.dev,scenewright.ink,www.scenewright.ink'
  SCENEWRIGHT_APP_URL = 'https://scenewright.ink'
  CANARY_COOKIE_SECURE = 'true'
  CANARY_ENV = 'production'
  CANARY_GENERATION_JOB_TIMEOUT_SECONDS = '900'
  CANARY_BATCH_JOB_TIMEOUT_SECONDS = '7200'
  # CANARY_QUEUE_DATABASE_URL uses a dedicated queue DB or private schema/role.
  CANARY_GENERATION_WORKERS = '5'
  CANARY_LABS_ENABLED = 'false'
  POSTHOG_TRACE_SAMPLE_RATE = '1'
  # POSTHOG_PROJECT_TOKEN and POSTHOG_HOST are configured together as secrets.
  CANARY_STRIPE_WEBHOOK_MAX_KB = '256'
  LITELLM_BASE_URL = 'http://127.0.0.1:4000'
  PULP_CREDITS_PER_PROVIDER_USD = '100'
  PULP_MODEL_COST_MARKUP = '2.0'

# Fly decodes the staged secret into an ADC file at Machine startup.
[[files]]
  guest_path = '/run/credentials/google-adc.json'
  secret_name = 'CANARY_VERTEX_ADC_B64'

[[mounts]]
  source = 'canary_projects'
  destination = '/projects'
  # Daily Fly snapshots are the first recovery layer, not the only backup:
  # docs/ops/backup-restore.md also requires an off-Fly copy and restore drills.
  scheduled_snapshots = true
  snapshot_retention = 14
  # A full volume breaks journals and paid-result recovery records. Grow in
  # 5 GB steps at 80% usage, capped so runaway growth still needs an operator.
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '5GB'
  auto_extend_size_limit = '50GB'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  # Off so a suspended/stopped Machine stays down instead of being woken by any
  # inbound request. Trade-off: while stopped, Fly serves errors rather than
  # booting the app — start it explicitly with `fly machine start -a canary-web`.
  auto_start_machines = false

# Unexpected container exits recover at most three times in Fly's five-minute
# window. SIGINT/SIGTERM is a successful exit; autostart remains disabled.
# /projects/.ops/recovery.json adds durable backoff and a latched crash budget.
[[restart]]
  policy = 'on-failure'
  retries = 3

  [http_service.concurrency]
    type = 'requests'
    # One shared-CPU Machine also runs LiteLLM, generation workers, and
    # Chromium for Finish/export. Keep enough room for SSE connections and assets
    # without allowing request bursts to exhaust the box.
    hard_limit = 50
    soft_limit = 30

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    # Fly caps HTTP-check grace periods at one minute.
    grace_period = '1m0s'
    method = 'GET'
    # Routing checks must remain cheap and local. Dependency readiness is
    # monitored separately at /api/health/ready so a transient Supabase or
    # LiteLLM outage does not make the only Machine unroutable.
    path = '/api/health'

    [http_service.checks.headers]
      # TrustedHostMiddleware only accepts the public production hostname.
      # Fly's internal probe otherwise sends a platform-internal Host value.
      Host = 'canary-web.fly.dev'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 4096

[[metrics]]
  port = 8000
  path = '/metrics'
