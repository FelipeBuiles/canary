# fly.toml app configuration file generated for canary-web on 2026-07-05T15:38:00-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'canary-web'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  CANARY_COOKIE_SECURE = 'true'
  CANARY_ENV = 'production'
  CANARY_GENERATION_JOB_TIMEOUT_SECONDS = '900'
  CANARY_GENERATION_WORKERS = '5'
  CANARY_LABS_ENABLED = 'false'
  CANARY_OTEL_ENABLED = 'true'
  LITELLM_BASE_URL = 'http://127.0.0.1:4000'

[[mounts]]
  source = 'canary_projects'
  destination = '/projects'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '2m0s'
    method = 'GET'
    path = '/api/health/ready'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 4096
