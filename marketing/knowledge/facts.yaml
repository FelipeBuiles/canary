# Pipeline and stations

- id: five-stations-public
  statement: The landing describes five stations, Story, Look, Cast, Pages and Book. This conflicts with the four-station app model and is not safe wording for new public claims.
  quote: "Five stations. Scenewright does the drafting between them"
  sources: [ web/src/locales/en.json:3213-3229, web/src/lib/stations.ts:38-82 ]
  marketable: false
  verifiedSources:
    web/src/locales/en.json: 9189983c4cd313b594e95edf757b6cfaeeaecdad58726533a1fdcf80b46c5146
