- id: public-reader-opt-in
  statement: Publishing a finished edition to the public reader is opt-in, and manuscripts, prompts and working files are not published.
  quote: "Publishing is opt-in. The author supplies a public title, author credit, description, and optional permission for homepage featuring. The preview opens the existing full-book reader. Publishing exposes reading and downloading; manuscripts, prompts, working files, and account identifiers are not included in the public manifest."
