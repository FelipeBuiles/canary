- id: four-stations-internal
  statement: The product model and app UI have four stations, Story, Look, Pages and Book. Cast lives inside Look. Avoid station counts in new copy while the landing conflicts.
  quote: "presented as four user-facing stations"
  sources: [ PRODUCT.md:22-24, web/src/lib/stations.ts:38-82 ]
  marketable: false
  verifiedSources:
    PRODUCT.md: dc149ea64d88d7d2ecda6d502665be62e62a1b7c3fa5a6968680c1e70306c483
    web/src/lib/stations.ts: 2ef843ce3f351db020c7c47000cca533798593523899669b3032176ae6ff7776

- id: eight-stage-engine
  statement: Under the stations runs an 8-stage engine (extract, brief, style, cast, adapt, plan, draw, finish), each stage resumable.
  quote: "through an 8-stage pipeline"
  sources: [ PRODUCT.md:20-21 ]
  marketable: false
  verifiedSources:
    PRODUCT.md: dc149ea64d88d7d2ecda6d502665be62e62a1b7c3fa5a6968680c1e70306c483

- id: adapt-plan-auto
  statement: The adaptation and page plan run automatically, stay inspectable and never block, so not every step waits for approval.
  quote: "Machine artifacts (adaptation and page plan) auto-run and stay inspectable but never block."
  sources: [ PRODUCT.md:25-26 ]
  marketable: false
  verifiedSources:
    PRODUCT.md: dc149ea64d88d7d2ecda6d502665be62e62a1b7c3fa5a6968680c1e70306c483

- id: step-story
  statement: In the Story step, Scenewright maps characters, places and scenes and lists what must happen; the author approves the brief.
  quote: "Scenewright maps the characters, places and scenes, and lists what must happen."
  sources: [ web/src/locales/en.json:3216-3217 ]
  marketable: true
  verifiedSources:
    web/src/locales/en.json: 9189983c4cd313b594e95edf757b6cfaeeaecdad58726533a1fdcf80b46c5146

- id: step-look
  statement: In the Look step, the author describes a look, shows a reference or asks for six directions, then compares proofs and keeps one.
  quote: "Describe it, show a reference, or ask for six directions. Compare the proofs side by side and keep one."
  sources: [ web/src/locales/en.json:3220 ]
  marketable: true
  verifiedSources:
    web/src/locales/en.json: 9189983c4cd313b594e95edf757b6cfaeeaecdad58726533a1fdcf80b46c5146

- id: step-cast
  statement: Character sheets and location plates help keep faces, costumes and rooms steady from page to page.
  quote: "Character sheets and location plates help keep faces, costumes and rooms steady from page to page."
  sources: [ web/src/locales/en.json:3223 ]
  marketable: true
  verifiedSources:
    web/src/locales/en.json: 9189983c4cd313b594e95edf757b6cfaeeaecdad58726533a1fdcf80b46c5146

- id: step-pages
  statement: Pages arrive drawn and lettered; the author asks for changes in plain words and redraws only what misses.
  quote: "Pages arrive drawn and lettered. Ask for changes in plain words and redraw only what misses."
  sources: [ web/src/locales/en.json:3226 ]
  marketable: true
  verifiedSources:
    web/src/locales/en.json: 9189983c4cd313b594e95edf757b6cfaeeaecdad58726533a1fdcf80b46c5146

- id: step-book
  statement: Authors can download a finished edition as PDF or CBZ, or opt into publishing it with a public reader link.
  quote: "Download your edition as PDF or CBZ, or publish it with a link readers can open anywhere."
  sources: [ web/src/locales/en.json:3229, docs/reference/public-books.md:5-10 ]
