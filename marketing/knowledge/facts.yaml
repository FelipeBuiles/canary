- id: ui-languages
  statement: The app is available in English, Spanish and French, and the comic's language is set per project independently of the UI language.
  quote: "The UI is available in English, Spanish, and French. Comic-output language is configured per project independently of the UI language."
  sources: [ PRODUCT.md:61-62 ]
  marketable: true
  verifiedSources:
    PRODUCT.md: dc149ea64d88d7d2ecda6d502665be62e62a1b7c3fa5a6968680c1e70306c483

