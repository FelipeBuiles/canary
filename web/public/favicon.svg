<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Scenewright">
  <!-- Background tile: cream "pressroom" paper with a hard ink frame.
       Keeps the pulp/print heritage of the product's design system. -->
  <rect width="48" height="48" rx="9" fill="#fcfaed" />
  <rect x="3.5" y="3.5" width="41" height="41" rx="7" fill="none" stroke="#1b1c15" stroke-width="2.4" />

  <!-- Proscenium "S": the mark reads as a theatrical proscenium arch
       whose curtain stroke curls into an S — a "maker of scenes"
       (scenewright), drawn as a single continuous ribbon so it
       reduces cleanly to 16px. -->
  <path
    d="M13 13.5c4-3 9-3.6 12.6-1.1 3.4 2.4 3.1 6.7-.7 9-2.6 1.6-6 2.2-9 3.2-3.1 1-5.7 2.9-5.8 5.8-.1 3.3 3.3 5.6 7 5.9 4.1.4 8.4-1 11.7-3.8"
    fill="none"
    stroke="#b51822"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Stage floor line: grounds the mark as scenery/a set, not a bare glyph. -->
  <path
    d="M14 36.5h20"
    stroke="#1b1c15"
    stroke-width="2.6"
    stroke-linecap="round"
  />
</svg>
