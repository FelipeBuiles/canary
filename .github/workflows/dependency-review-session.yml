name: Dependency review session

# Temporary branch-only resolver. No production environment or provider secrets.
on:
  push:
    branches: [fix/dependency-refresh-2026-09]
    paths:
      - .github/workflows/dependency-review-session.yml
      - scripts/_dependency_refresh_session.py
permissions:
  contents: write
concurrency:
  group: dependency-review-session
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependency-refresh-2026-09
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: '0.12.17'
      - name: Apply reviewed upgrades
        run: |
          mkdir -p /tmp/dependency-review
          if [ ! -f litellm/uv.lock ]; then
            python scripts/_dependency_refresh_session.py | tee /tmp/dependency-review/selection.log
          fi
      - name: Resolve Python locks
        id: python_locks
        continue-on-error: true
        run: |
          uv lock --project novel_to_comic --upgrade 2>&1 | tee /tmp/dependency-review/backend-resolution.log
          uv lock --project litellm --upgrade 2>&1 | tee /tmp/dependency-review/gateway-resolution.log
      - name: Resolve JavaScript locks
        id: npm_locks
        continue-on-error: true
        run: |
          for directory in . web showcase/video; do
            (cd "$directory" && npm install --package-lock-only --ignore-scripts) || exit 1
          done
      - name: Save authored manifests and generated locks to review branch
        id: save
        continue-on-error: true
        if: steps.python_locks.outcome == 'success' && steps.npm_locks.outcome == 'success'
        run: |
          git add Dockerfile docker-compose.yml package.json package-lock.json \
            web/package.json web/package-lock.json \
            novel_to_comic/pyproject.toml novel_to_comic/uv.lock \
            novel_to_comic/tests/test_launch_safety.py litellm/Dockerfile litellm/pyproject.toml litellm/uv.lock \
            showcase/video/package.json
          git add -f .nvmrc showcase/video/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(deps): upgrade Python, web, video, and operational dependency locks'
            git push origin HEAD:fix/dependency-refresh-2026-09
          fi
      - name: Install actual gateway libraries and capture upstream patch targets
        id: gateway_install
        continue-on-error: true
        run: |
          uv sync --project litellm --locked
          uv pip check --python litellm/.venv/bin/python
          litellm/.venv/bin/python - <<'PY'
          import importlib.util, json, pathlib
          root = pathlib.Path(importlib.util.find_spec('litellm').origin).parent
          names = ['llms/custom_httpx/http_handler.py', 'llms/anthropic/chat/transformation.py', 'llms/anthropic/chat/handler.py']
          pathlib.Path('/tmp/dependency-review/upstream.json').write_text(json.dumps({name: (root / name).read_text() for name in names}))
          from google.genai import types
          config = types.GenerateContentConfig(image_config=types.ImageConfig(aspect_ratio='4:5', image_size='2K'))
          assert config.image_config.aspect_ratio == '4:5'
          import google.auth, google.cloud.aiplatform
          print('Google SDK image controls and Vertex imports passed')
          PY
      - name: Apply fail-closed gateway patches
        id: patches
        continue-on-error: true
        run: |
          litellm/.venv/bin/python litellm/patch_http_errors.py
          litellm/.venv/bin/python litellm/patch_anthropic_refusals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-review-upstream
          path: /tmp/dependency-review/upstream.json
          retention-days: 3
      - name: Backend install
        id: backend_install
        continue-on-error: true
        run: |
          uv sync --project novel_to_comic --locked --extra web --extra dev --extra otel
          uv pip check --python novel_to_comic/.venv/bin/python
          uv run --project novel_to_comic playwright install --with-deps chromium
      - name: Backend lint
        id: backend_lint
        continue-on-error: true
        run: uv run --project novel_to_comic ruff check novel_to_comic 2>&1 | tee /tmp/dependency-review/ruff.log
      - name: Backend tests
        id: backend
        continue-on-error: true
        run: uv run --project novel_to_comic pytest novel_to_comic/tests -q --tb=short 2>&1 | tee /tmp/dependency-review/pytest.log
      - name: Web install
        id: web_install
        continue-on-error: true
        working-directory: web
        run: npm ci
      - name: Web tests
        id: web_tests
        continue-on-error: true
        working-directory: web
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
        run: npm test 2>&1 | tee /tmp/dependency-review/vitest.log
      - name: Web lint
        id: web_lint
        continue-on-error: true
        working-directory: web
        run: npm run lint 2>&1 | tee /tmp/dependency-review/eslint.log
      - name: Web build
        id: web_build
        continue-on-error: true
        working-directory: web
        run: npm run build 2>&1 | tee /tmp/dependency-review/web-build.log
      - name: Root tooling and video validation
        id: video
        continue-on-error: true
        run: |
          npm ci
          cd showcase/video
          npm ci
          npm run lint 2>&1 | tee /tmp/dependency-review/video-lint.log
          npm run build 2>&1 | tee /tmp/dependency-review/video-build.log
      - name: JavaScript security inventory and Compose validation
        id: npm_audit
        continue-on-error: true
        run: |
          docker compose config --quiet
          (cd web && npm audit --json > /tmp/dependency-review/npm-audit.json) || true
          (cd web && npm run audit:production)
      - name: Python security inventory
        id: python_audit
        continue-on-error: true
        run: uv run --project novel_to_comic --with pip-audit==2.10.1 pip-audit --format json --output /tmp/dependency-review/python-audit.json
      - name: Capture review evidence
        if: always()
        run: |
          mkdir -p /tmp/dependency-review
          git diff > /tmp/dependency-review/uncommitted.patch
          git rev-parse HEAD > /tmp/dependency-review/head.txt
          python - <<'PY'
          import json, pathlib, subprocess
          paths = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          source = {}
          for path in paths:
              try:
                  text = pathlib.Path(path).read_text()
                  if '\x00' not in text: source[path] = text
              except (UnicodeError, OSError): pass
          pathlib.Path('/tmp/dependency-review/source.json').write_text(json.dumps(source))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-review-evidence
          path: /tmp/dependency-review/
          retention-days: 3
      - name: Require all validation outcomes
        if: always()
        env:
          OUTCOMES: ${{ join(steps.*.outcome, ',') }}
        run: |
          if [[ "$OUTCOMES" == *failure* ]]; then
            echo 'One or more review checks failed; inspect the saved evidence.'
            exit 1
          fi
