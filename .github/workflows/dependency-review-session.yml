name: Dependency review session
# Temporary branch-only work and disposable integration tests; removed before merge.
on:
  push:
    branches: [fix/dependency-refresh-2026-09]
    paths: [.github/workflows/dependency-review-session.yml]
permissions:
  contents: read
concurrency:
  group: dependency-review-session
  cancel-in-progress: true
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependency-refresh-2026-09
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Apply reviewed compatibility fixes
        run: |
          if ! grep -q '\[tool.ruff\]' novel_to_comic/pyproject.toml; then
            python scripts/_dependency_finish_session.py
          fi
          (cd web && npm install --package-lock-only --ignore-scripts)
          git add docker-compose.yml novel_to_comic/pyproject.toml \
            novel_to_comic/src/novel_to_comic/cast_instructions.py \
            novel_to_comic/tests/test_labs_gate.py novel_to_comic/tests/test_cast_asset_routes.py \
            novel_to_comic/tests/test_complete_page_draw.py novel_to_comic/tests/test_lettering_translation.py \
            web/src/components/lettering/LetteringCanvas.tsx web/src/pages/BackofficePage.tsx \
            web/src/__tests__/castCorrectionRecovery.test.tsx web/src/__tests__/sentry.test.ts \
            web/package.json web/package-lock.json web/scripts/audit-production.mjs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): adapt FastAPI introspection, React lint contracts, and remove audit bypass'
            git push origin HEAD:fix/dependency-refresh-2026-09
          fi
      - name: Save exact reviewed source
        run: |
          mkdir -p /tmp/evidence
          git rev-parse HEAD > /tmp/evidence/head.txt
          python - <<'PY'
          import json, pathlib, subprocess
          source = {}
          for p in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              try:
                  text=pathlib.Path(p).read_text()
                  if '\x00' not in text: source[p]=text
              except (UnicodeError, OSError): pass
          pathlib.Path('/tmp/evidence/source.json').write_text(json.dumps(source))
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: final-source
          path: /tmp/evidence
          retention-days: 3
  observability:
    needs: finish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: canary-dependency-smoke
      LANGFUSE_TELEMETRY_ENABLED: 'false'
      LANGFUSE_INIT_ORG_ID: dependency-smoke-org
      LANGFUSE_INIT_ORG_NAME: Dependency smoke
      LANGFUSE_INIT_PROJECT_ID: dependency-smoke-project
      LANGFUSE_INIT_PROJECT_NAME: Dependency smoke
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-dependency-smoke
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-dependency-smoke
      LANGFUSE_INIT_USER_EMAIL: smoke@example.invalid
      LANGFUSE_INIT_USER_NAME: Dependency smoke
      LANGFUSE_INIT_USER_PASSWORD: isolated-smoke-password-123
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependency-refresh-2026-09
      - name: Cold-boot fresh observability volumes
        run: |
          mkdir -p /tmp/evidence
          docker compose config --quiet
          docker compose up -d langfuse-web langfuse-worker
          healthy=false
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/api/public/health > /tmp/evidence/health.json; then healthy=true; break; fi
            sleep 3
          done
          test "$healthy" = true
      - name: Verify Canary's legacy ingestion protocol
        run: |
          python - <<'PY'
          import base64, datetime, json, urllib.request, uuid
          event_id=str(uuid.uuid4())
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          payload={'batch':[{'id':str(uuid.uuid4()),'type':'trace-create','timestamp':now,'body':{'id':event_id,'name':'dependency-smoke','timestamp':now,'input':'fixture only'}}]}
          req=urllib.request.Request('http://127.0.0.1:3000/api/public/ingestion',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json','Authorization':'Basic '+base64.b64encode(b'pk-lf-dependency-smoke:sk-lf-dependency-smoke').decode()})
          with urllib.request.urlopen(req,timeout=30) as r: result=json.load(r)
          print(json.dumps(result))
          assert not result.get('errors'), result
          assert result.get('successes'), result
          open('/tmp/evidence/ingestion.json','w').write(json.dumps(result))
          PY
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.104
      - name: Verify release CLI interfaces without credentials
        run: |
          flyctl version
          flyctl deploy --help > /tmp/evidence/fly-deploy-help.txt
          grep -q -- --remote-only /tmp/evidence/fly-deploy-help.txt
          grep -q -- --build-arg /tmp/evidence/fly-deploy-help.txt
          flyctl releases --help > /tmp/evidence/fly-releases-help.txt
      - name: Capture logs and remove disposable volumes
        if: always()
        run: |
          mkdir -p /tmp/evidence
          docker compose ps -a > /tmp/evidence/services.txt
          docker compose logs --no-color > /tmp/evidence/observability.log 2>&1
          docker compose down -v
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: observability-evidence
          path: /tmp/evidence
          retention-days: 3
