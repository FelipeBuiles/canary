name: Apply TypeSafe recovery hardening
on:
  push:
    branches: [fix/typesafe-confidence-review]
    paths: [.github/workflows/typesafe-recovery-fix.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Apply verified recovery patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '747d0669d88ea9c75c7c05fc29e586778e77748677945fbf49dd4c044f813ce2'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
      - name: Validate with locked repository dependencies
        working-directory: novel_to_comic
        run: |
          uv sync --frozen --extra web --extra dev
          uv run ruff check .
          uv run pytest -q tests/test_typesafe_decisions.py tests/test_decision_review_evaluation.py tests/test_complete_page_draw.py::test_native_vertex_transport_preserves_reference_order_and_returns_one_page
      - name: Commit validated fix and remove temporary workflow
        run: |
          git rm .github/workflows/typesafe-recovery-fix.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: journal decision submissions before spend and preserve incomplete receipts'
          git push origin HEAD:fix/typesafe-confidence-review
