name: CI

# Test + build gate. Every PR and push to main must pass before merge or deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger for prod release validation

permissions:
  contents: read

# Manual releases cannot cancel one another or be cancelled by normal CI.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novel_to_comic
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: novel_to_comic/uv.lock
      - name: Sync dependencies
        # Include actual optional production telemetry and web integrations.
        run: uv sync --locked --extra web --extra dev --extra otel
      - name: Check locked production dependencies
        run: |
          uv pip check
          uv export --locked --extra web --extra otel --no-dev --no-emit-project > /tmp/app-requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/app-requirements.txt --no-deps --disable-pip
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium
      - name: Documentation reliability
        working-directory: .
        run: python scripts/check_docs_reliability.py
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -x -q
      - name: Full-page contract gates
        # Local fixtures only; no provider credentials or credits required.
        run: uv run pytest -q tests/test_full_page_contracts.py

  web:
    name: Web (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies and validate peers
        run: |
          npm ci
          npm ls --all
      - name: Dependency audits
        # No advisory allowlist: fail closed on production or tooling findings.
        run: |
          npm run audit:production
          npm audit --audit-level=high
      - name: Vitest
        # Import-time Supabase validation requires non-secret placeholders.
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
        run: npm run test
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    name: Docker image (build smoke test)
    runs-on: ubuntu-latest
    # Build production end-to-end without publishing or deploying an image.
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Prepare build metadata
        id: build_meta
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            CANARY_VERSION=${{ github.sha }}
            CANARY_BUILD_TIMESTAMP=${{ steps.build_meta.outputs.timestamp }}
            VITE_SUPABASE_URL=https://ci-smoke.supabase.co
            VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_smoke
            VITE_CANARY_ENV=production
          secrets: |
            POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gateway:
    name: Gateway dependency contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: litellm/uv.lock
      - name: Install the shared gateway lock
        run: |
          uv sync --project litellm --locked
          uv pip check --python litellm/.venv/bin/python
      - name: Check real SDK and patched provider behavior
        run: |
          litellm/.venv/bin/python litellm/patch_http_errors.py
          litellm/.venv/bin/python litellm/patch_anthropic_refusals.py
          litellm/.venv/bin/python -m pytest litellm/tests -q
      - name: Build the local gateway image
        run: docker build -f litellm/Dockerfile -t canary-gateway-ci .
      - name: Verify database-free and PostgreSQL-backed gateway startup
        run: python scripts/smoke_gateway.py canary-gateway-ci
      - name: Check locked production dependencies
        run: |
          uv export --project litellm --locked --no-dev --no-emit-project > /tmp/gateway-requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/gateway-requirements.txt --no-deps --disable-pip

  tooling:
    name: Root and showcase tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            showcase/video/package-lock.json
      - name: Root tooling
        run: |
          npm ci
          npm ls --all
          npm audit --audit-level=high
      - name: Showcase video
        working-directory: showcase/video
        run: |
          npm ci
          npm ls --all
          npm run lint
          npm run build
          npm audit --audit-level=high

  deploy:
    name: Deploy production
    needs: [backend, web, docker, gateway, tooling]
    # The authenticated drain barrier excludes new admissions and stays set
    # on failure. Production remains restricted to an explicit main dispatch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://scenewright.ink
    concurrency:
      group: production-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment configuration
        env:
          CANARY_OPS_TOKEN: ${{ secrets.CANARY_OPS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=()
          for name in FLY_API_TOKEN CANARY_OPS_TOKEN VITE_SUPABASE_URL \
            VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing production secrets: ${missing[*]}"
            exit 1
          fi
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.104
      - name: Prepare release metadata
        id: release
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "image=registry.fly.io/canary-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Authenticate to the Fly registry
        run: flyctl auth docker
      # Build before draining so customers are not blocked during the build.
      # The pushed image is the exact artifact deployed and rolled back to.
      - name: Build and push release image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.release.outputs.image }}
          build-args: |
            CANARY_VERSION=${{ github.sha }}
            CANARY_BUILD_TIMESTAMP=${{ steps.release.outputs.timestamp }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_POSTHOG_PROJECT_TOKEN=${{ secrets.POSTHOG_PROJECT_TOKEN }}
            VITE_POSTHOG_HOST=${{ vars.POSTHOG_HOST }}
            POSTHOG_PROJECT_ID=${{ vars.POSTHOG_PROJECT_ID }}
            VITE_CANARY_ENV=production
          secrets: |
            POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          cache-from: type=gha
      - name: Smoke test release image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint /app/novel_to_comic/.venv/bin/python "$IMAGE" \
            -c "import novel_to_comic.server.app, novel_to_comic.server.durable_queue"
          docker run --rm --entrypoint /app/.venv-litellm/bin/python "$IMAGE" -c "import litellm"
      - name: Drain production and wait for running work
        env:
          CANARY_OPS_TOKEN: ${{ secrets.CANARY_OPS_TOKEN }}
          # Direct Fly route, still protected by CANARY_OPS_TOKEN.
          SCENEWRIGHT_APP_URL: https://canary-web.fly.dev
        run: python scripts/check_deploy_safe.py
      - name: Record rollback target
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Release image: \`${IMAGE}\` (\`${DIGEST}\`)"
            echo "- Roll back with \`flyctl deploy -a canary-web --image <previous image>\`. Previous releases:"
            echo '```'
            flyctl releases -a canary-web --image | head -n 3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy exact release image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: flyctl deploy -a canary-web --image "$IMAGE"
      - name: Verify deployed release
        env:
          EXPECTED_CANARY_VERSION: ${{ github.sha }}
          SCENEWRIGHT_APP_URL: https://scenewright.ink
        run: python scripts/verify_deployment.py
      - name: Record deployed release
        if: success()
        run: |
          {
            echo
            echo "- Deployment verification: passed"
            echo "- Public URL: https://scenewright.ink"
          } >> "$GITHUB_STEP_SUMMARY"
