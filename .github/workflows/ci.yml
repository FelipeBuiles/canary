name: CI

# Test + build gate. Every PR and push to main must pass this before merge or
# deploy — it's the launch-readiness green-CI gate (P0 #1). A failing billing
# test (P1 #5) or any regression here blocks `fly deploy`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual trigger for prod release validation

# Cancel superseded runs on the same ref — keeps the queue cheap on a busy branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novel_to_comic
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        # setup-uv stopped publishing floating major tags after v7, so pin the
        # exact stable release. Bump deliberately when upgrading.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: novel_to_comic/uv.lock

      - name: Sync dependencies
        # ruff + pytest live in the `dev` extra, and the test suite imports
        # FastAPI from the `web` extra — plain `uv sync --frozen` installs
        # neither, so `uv run ruff`/`pytest` fail with "No such file or
        # directory". Mirror the Dockerfile's explicit-extras style.
        run: uv sync --frozen --extra web --extra dev

      - name: Install Playwright Chromium
        # HTML renderer tests launch a real browser. The Python package does
        # not download Playwright's browser binaries during dependency sync.
        run: uv run playwright install --with-deps chromium

      - name: Ruff (lint + format check)
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -x -q

      - name: Full-page contract gates
        # Keep the current page-generation contract visible as its own CI
        # check. These tests use local fixtures and never require provider
        # credentials or credits.
        run: uv run pytest -q tests/test_full_page_contracts.py

  web:
    name: Web (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        # The app uses declarative BrowserRouter, not React Router's unstable
        # RSC APIs. The audit helper allows only that documented non-applicable
        # advisory and still fails on every other high/critical finding.
        run: npm run audit:production

      # supabase.ts throws at import time when VITE_SUPABASE_* are unset, which
      # breaks the two suites that pull it in transitively (api/client →
      # store/insufficientCredits). web/.env is gitignored, so provide
      # placeholders here — values are irrelevant to the unit tests.
      - name: Vitest
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
        run: npm run test

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker image (build smoke test)
    runs-on: ubuntu-latest
    # Builds the production image end-to-end but does NOT push it. Catches
    # Dockerfile regressions (e.g. the latent theme_tokens.json copy bug that
    # broke every Docker build for weeks while CI stayed green). Runs in
    # parallel with backend/web — it's the slow job (~5 min, pulls Python +
    # Playwright/Chromium) and a separate failure surface.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare build metadata
        id: build_meta
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          # The frontend stage inlines VITE_* at build time; supply placeholders
          # so the build succeeds. Values are irrelevant for a smoke test.
          build-args: |
            CANARY_VERSION=${{ github.sha }}
            CANARY_BUILD_TIMESTAMP=${{ steps.build_meta.outputs.timestamp }}
            VITE_SUPABASE_URL=https://ci-smoke.supabase.co
            VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_smoke
            VITE_CANARY_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    needs: [backend, web, docker]
    # Production remains human-triggered. The authenticated drain barrier below
    # excludes new admissions before checking idle and stays set on failure.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://scenewright.ink
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate deployment configuration
        env:
          CANARY_OPS_TOKEN: ${{ secrets.CANARY_OPS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=()
          for name in FLY_API_TOKEN CANARY_OPS_TOKEN VITE_SUPABASE_URL \
            VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing production secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.4.49

      - name: Drain production and wait for idle
        env:
          CANARY_OPS_TOKEN: ${{ secrets.CANARY_OPS_TOKEN }}
          # Keep the deployment guard off the public Cloudflare proxy. The
          # direct Fly hostname is still protected by CANARY_OPS_TOKEN.
          SCENEWRIGHT_APP_URL: https://canary-web.fly.dev
        run: python scripts/check_deploy_safe.py

      - name: Record rollback target
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Previous Fly release:"
            echo '```'
            flyctl releases -a canary-web | head -n 3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release metadata
        id: release
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Deploy exact tested revision
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          flyctl deploy --remote-only -a canary-web \
            --build-arg "CANARY_VERSION=${GITHUB_SHA}" \
            --build-arg "CANARY_BUILD_TIMESTAMP=${{ steps.release.outputs.timestamp }}" \
            --build-arg "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}" \
            --build-arg "VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}" \
            --build-arg "VITE_CANARY_ENV=production" \
            --build-arg "VITE_SENTRY_DSN=${VITE_SENTRY_DSN}"

      - name: Verify deployed release
        env:
          EXPECTED_CANARY_VERSION: ${{ github.sha }}
          # This deliberately checks the user-facing route through Cloudflare.
          SCENEWRIGHT_APP_URL: https://scenewright.ink
        run: python scripts/verify_deployment.py

      - name: Record deployed release
        if: success()
        run: |
          {
            echo
            echo "- Deployment verification: passed"
            echo "- Public URL: https://scenewright.ink"
          } >> "$GITHUB_STEP_SUMMARY"
