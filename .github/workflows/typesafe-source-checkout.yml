name: Apply tested TypeSafe implementation
on:
  push:
    branches: [fix/typesafe-confidence-review]
    paths: [.github/typesafe-patch-3.b64]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage final TypeSafe patch segment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply tested source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.github/typesafe-patch-{i}.b64').read_text() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '1f6f2620b8524c4900caf6490f05fa88043c2d8fefe4d230cf1f56af8e3abd95', 'patch checksum mismatch'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm .github/typesafe-patch-*.b64 .github/workflows/typesafe-source-checkout.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add bounded TypeSafe review evaluation and guarded classifier cascade'
          git push origin HEAD:fix/typesafe-confidence-review
