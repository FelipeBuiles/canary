name: Repair existing import lint blockers
on:
  push:
    branches: [fix/typesafe-confidence-review]
    paths: [.github/workflows/typesafe-ci-unblock.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve fixture registration and remove unused import
        run: |
          python3 - <<'PY'
          import pathlib
          changes = {
              'novel_to_comic/src/novel_to_comic/cast_instructions.py': ('from pydantic import BaseModel, Field', 'from pydantic import BaseModel'),
              'novel_to_comic/tests/test_lettering_translation.py': ('from .test_hybrid_lettering import book, save, update', 'from .test_hybrid_lettering import book as book, save, update'),
          }
          for name, (old, new) in changes.items():
              path = pathlib.Path(name)
              content = path.read_text()
              assert content.count(old) == 1, name
              path.write_text(content.replace(old, new))
          PY
          python3 -m pip install ruff==0.15.10
          cd novel_to_comic
          python3 -m ruff check .
      - name: Commit import-only repair and remove temporary workflow
        run: |
          git add novel_to_comic/src/novel_to_comic/cast_instructions.py novel_to_comic/tests/test_lettering_translation.py
          git rm .github/workflows/typesafe-ci-unblock.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: preserve shared pytest fixture imports and unblock backend lint'
          git push origin HEAD:fix/typesafe-confidence-review
