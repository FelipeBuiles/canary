name: Gateway upgrade integration
# Temporary branch-scoped resolution; retained smoke script joins normal CI.
on:
  push:
    branches: [fix/dependency-refresh-2026-09]
    paths: [.github/workflows/dependency-gateway-session.yml]
permissions:
  contents: write
jobs:
  gateway_database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dependency-refresh-2026-09
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: '0.12.17'
      - name: Restore the upstream-supported database dependencies and baked engines
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('litellm/pyproject.toml')
          if '"prisma>=' not in p.read_text():
              p.write_text(p.read_text().replace('  "litellm[proxy]==1.101.0",', '''  "litellm[proxy]==1.101.0",
            # The PyPI proxy extra omits the database runtime bundled upstream.
            "prisma>=0.11.0,<1.0",
            "psycopg[binary]>=3.2,<4.0",'''))
              for filename, stage, venv in (
                  ('Dockerfile', 'frontend', '/app/.venv-litellm'),
                  ('litellm/Dockerfile', 'node-runtime', '/app/.venv'),
              ):
                  file = Path(filename)
                  source = file.read_text()
                  if filename.startswith('litellm/'):
                      source = 'FROM node:24.21.0-bookworm-slim AS node-runtime\n\n' + source
                  anchor = '    uv sync --project /app/gateway --locked --no-dev --no-install-project\n'
                  assert source.count(anchor) == 1
                  block = f'''
          # Prisma's generated client and CLI engines must exist before startup.
          # Node is shared with the reviewed frontend runtime; npm is build-only.
          COPY --from={stage} /usr/local/bin/node /usr/local/bin/node
          COPY --from={stage} /usr/local/lib/node_modules/npm /usr/local/lib/node_modules/npm
          RUN apt-get update && apt-get install -y --no-install-recommends openssl \\
              && rm -rf /var/lib/apt/lists/* \\
              && ln -s /usr/local/lib/node_modules/npm/bin/npm-cli.js /usr/local/bin/npm
          ENV PRISMA_BINARY_CACHE_DIR=/opt/prisma/binaries \\
              PRISMA_CLI_PATH=/opt/prisma/binaries/node_modules/.bin/prisma \\
              PRISMA_CLI_QUERY_ENGINE_TYPE=binary
          RUN PATH="{venv}/bin:$PATH" HOME=/opt/prisma XDG_CACHE_HOME=/opt/prisma/.cache \\
              {venv}/bin/python -c 'from importlib.util import find_spec; from pathlib import Path; import subprocess, sys; schema = Path(find_spec("litellm").origin).parent / "proxy/schema.prisma"; assert schema.is_file(), schema; subprocess.run([sys.executable, "-m", "prisma", "generate", "--schema", str(schema)], check=True)' \\
              && chmod -R a+rX /opt/prisma \\
              && test -x /opt/prisma/binaries/node_modules/.bin/prisma \\
              && rm -rf /usr/local/lib/node_modules/npm /usr/local/bin/npm
          ENV PRISMA_OFFLINE_MODE=true
          '''
                  source = source.replace(anchor, anchor + block)
                  if filename.startswith('litellm/'):
                      source = source.replace('ENV PYTHONPATH=/app:/app/litellm_handlers', 'ENV PATH="/app/.venv/bin:$PATH"\nENV PYTHONPATH=/app:/app/litellm_handlers')
                  file.write_text(source)
              p = Path('litellm/entrypoint.sh')
              old = '  PYTHONPATH=/app:/app/litellm_handlers /app/.venv-litellm/bin/litellm \\\n'
              assert p.read_text().count(old) == 1
              p.write_text(p.read_text().replace(old, '  PATH="/app/.venv-litellm/bin:$PATH" \\\n' + old))
              p = Path('scripts/smoke_gateway.py')
              p.write_text(p.read_text().replace('    return result.stdout.strip()', '    return (result.stdout + result.stderr).strip() if args[0] == "logs" else result.stdout.strip()'))
          PY
          uv lock --project litellm
          git add litellm/pyproject.toml litellm/uv.lock litellm/Dockerfile Dockerfile litellm/entrypoint.sh scripts/smoke_gateway.py
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): restore Prisma database runtime and bake gateway engines'
            git push origin HEAD:fix/dependency-refresh-2026-09
          fi
      - name: Documentation reliability
        run: python scripts/check_docs_reliability.py
      - name: Build locked gateway
        run: docker build -f litellm/Dockerfile -t canary-gateway-ci .
      - name: Verify database-free and PostgreSQL-backed startup and API keys
        run: python scripts/smoke_gateway.py canary-gateway-ci
      - name: Audit the complete database-enabled dependency lock
        run: |
          uv export --project litellm --locked --no-dev --no-emit-project > /tmp/gateway-requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/gateway-requirements.txt --no-deps --disable-pip
      - name: Save exact reviewed source and runtime versions
        if: always()
        run: |
          mkdir -p /tmp/evidence
          git rev-parse HEAD > /tmp/evidence/head.txt
          python - <<'PY'
          import json, pathlib, subprocess
          source = {}
          for p in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              try:
                  text=pathlib.Path(p).read_text()
                  if '\x00' not in text: source[p]=text
              except (UnicodeError, OSError): pass
          pathlib.Path('/tmp/evidence/source.json').write_text(json.dumps(source))
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: gateway-final-source
          path: /tmp/evidence
          retention-days: 3
