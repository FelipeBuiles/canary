name: Verify lettering correction
# Temporary branch-only publication. No providers, deployment, or production secrets.
on:
  push:
    branches: [feat-lettering-desk-20260915]
    paths: [.github/workflows/lettering-review-source.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/feat-lettering-desk-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Apply exact recovered correction
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, re, subprocess
          from pathlib import Path
          pieces = sorted(Path('.lettering-review-transfer').glob('*'))
          assert [p.name for p in pieces] == ['01', '02']
          patch = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in pieces), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd169491b58c248f63a43e52b4634863825d5ef986cd8da1d196079083a3f445f'
          paths = re.findall(r'^diff --git a/(.+) b/.+$', patch.decode(), re.M)
          assert len(paths) == 16
          assert all(p.startswith(('docs/', 'novel_to_comic/', 'web/')) and '..' not in Path(p).parts for p in paths)
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          Path('/tmp/lettering-correction-paths').write_text('\n'.join(paths))
          PY
          git diff --check
      - name: Backend dependencies and pinned Chromium
        working-directory: novel_to_comic
        run: |
          uv sync --frozen --extra web --extra dev
          uv run playwright install --with-deps chromium
      - name: Backend checks
        working-directory: novel_to_comic
        run: |
          uv run ruff check .
          uv run pytest -q
      - name: Frontend checks
        working-directory: web
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Documentation reliability
        run: python scripts/check_docs_reliability.py
      - name: Publish verified correction on this branch only
        run: |
          test "$GITHUB_REF" = refs/heads/feat-lettering-desk-20260915
          xargs -d '\n' git add -- < /tmp/lettering-correction-paths
          git rm -r .lettering-review-transfer
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: correct style suggestion schema and refine comic lettering'
          git push origin HEAD:refs/heads/feat-lettering-desk-20260915
          echo "Verified correction: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
