name: Lettering regression source
# Temporary read-only recovery fixture; removed with the finished correction.
on:
  push:
    branches: [feat-lettering-desk-20260915]
    paths: [.github/workflows/lettering-review-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/lettering-recovery
          cp .lettering-review-transfer/01 .lettering-review-transfer/02 /tmp/lettering-recovery/
      - uses: actions/upload-artifact@v7
        with:
          name: lettering-correction-recovery
          path: /tmp/lettering-recovery/
          retention-days: 1
          if-no-files-found: error
