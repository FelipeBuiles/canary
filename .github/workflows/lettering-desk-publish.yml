name: Publish verified lettering desk
# Temporary branch-only transport. Removes itself and all transport files.
# No provider credentials, deployments, or changes to other branches.
on:
  push:
    branches: [feat-lettering-desk-20260915]
    paths: [.github/workflows/lettering-desk-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat-lettering-desk-20260915
          fetch-depth: 0
      - name: Verify and apply exact locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          expected = '0bd8ee212de1a7c6c9eddb0c516659ef9acf27671d5c81436a2d8eb06242d6ec'
          encoded = ''.join(pathlib.Path(f'.desk-transfer/{i:02}').read_text().strip() for i in range(1, 10))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 317121
          assert hashlib.sha256(patch).hexdigest() == expected, 'Transport checksum mismatch'
          target = pathlib.Path('/tmp/lettering-desk.patch')
          target.write_bytes(patch)
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True).splitlines()
          assert len(stats) == 72, f'Unexpected file count: {len(stats)}'
          allowed = {'AGENTS.md', 'CONTEXT.md', 'Dockerfile', 'docs', 'novel_to_comic', 'web'}
          for line in stats:
              path = pathlib.PurePosixPath(line.split('\t', 2)[2])
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] in allowed, str(path)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          subprocess.run(['git', 'add', 'AGENTS.md', 'CONTEXT.md', 'Dockerfile', 'docs', 'novel_to_comic', 'web'], check=True)
          actual = subprocess.check_output(['git', 'diff', '--cached', '--binary'])
          assert hashlib.sha256(actual).hexdigest() == expected, 'Applied tree differs from tested patch'
          print(f'Verified exact 72-file patch: {expected}')
          PY
          git diff --cached --check
      - name: Commit implementation and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .desk-transfer .github/workflows/lettering-desk-publish.yml
          test "$(git diff --cached --name-only ead22c2cdbbc7870cd9d1d55db9ada617393af3b | wc -l)" -eq 72
          if git diff --cached --name-only ead22c2cdbbc7870cd9d1d55db9ada617393af3b | grep -E '^(\.desk-transfer/|\.github/)'; then
            echo 'Unexpected helper in final tree' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: hybrid full-page art and editable lettering desk'
          git push origin HEAD:refs/heads/feat-lettering-desk-20260915
          {
            echo '## Verified lettering implementation'
            echo '- Applied the exact locally tested 72-file patch; checksum verified.'
            echo '- Removed the temporary workflow and transport files from the final tree.'
            echo '- Local verification: 1756 backend tests passed, 14 skipped; 471 frontend tests passed; lint, build, documentation checks passed.'
            echo '- Actual browser checks: desktop/mobile layout, move/resize/tail interactions, undo, save, and preview/export line parity passed.'
            echo '- No paid provider calls or deployment were performed. PR CI must run separately.'
          } >> "$GITHUB_STEP_SUMMARY"
