    supports_response_schema: true
    supports_system_messages: true
    supports_vision: true
    supports_native_streaming: true
    supports_prompt_caching: true
    max_input_tokens: 922000
    max_output_tokens: 128000
    input_cost_per_token: 2.0e-06
    cache_read_input_token_cost: 2.0e-07
    output_cost_per_token: 1.0e-05
    input_cost_per_token_above_272k_tokens: 4.0e-06
    cache_read_input_token_cost_above_272k_tokens: 4.0e-07
    output_cost_per_token_above_272k_tokens: 1.5e-05
- model_name: gpt-6-luna
  litellm_params:
    model: openai/gpt-6-luna
    api_key: os.environ/OPENAI_API_KEY
    reasoning_effort: medium
