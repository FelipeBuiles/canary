    cache_read_input_token_cost_above_272k_tokens: 2.0e-08
    output_cost_per_token_above_272k_tokens: 7.5e-07
- model_name: gemini-3.8-flash
  litellm_params:
    # Project-scoped Vertex REST calls use Google Cloud billing/credits.
    # Authentication uses ADC, never a Gemini Developer API key.
    model: vertex_ai/gemini-3.8-flash
    vertex_project: os.environ/VERTEXAI_PROJECT
    vertex_location: os.environ/VERTEXAI_LOCATION
    reasoning_effort: medium
  model_info:
    mode: chat
    supports_reasoning: true
    supports_response_schema: true
    supports_system_messages: true
    supports_vision: true
    supports_native_streaming: true
    supports_prompt_caching: true
    max_input_tokens: 1048576
    max_output_tokens: 65536
    # Global introductory USD rates through 2026-12-31; review before 2027.
    input_cost_per_token: 7.5e-07
    cache_read_input_token_cost: 7.5e-08
    output_cost_per_token: 3.75e-06
    output_cost_per_reasoning_token: 3.75e-06
- model_name: gemini-4-argon
  litellm_params:
    model: vertex_ai/gemini-4-argon
    vertex_project: os.environ/VERTEXAI_PROJECT
    vertex_location: os.environ/VERTEXAI_LOCATION
    # Verified native Low/Medium/High levels. Avoid LiteLLM's legacy budget mapping.
    thinkingConfig:
      thinkingLevel: medium
      includeThoughts: true
  model_info:
    mode: chat
    # JSON mode and small schemas verified 2026-10-13; full Extract native
    # schema returns 400. Stages keep schema instructions and local validation.
    supports_reasoning: true
    supports_response_schema: true
    supports_vision: true
    supports_native_streaming: false
    supports_prompt_caching: false
    # Provisional launch rates, operator-approved 2026-10-13. Vertex tariff,
    # cache availability/storage charges and intro expiry remain unconfirmed.
    # https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/
    input_cost_per_token: 2.0e-06
    cache_read_input_token_cost: 1.0e-07
    output_cost_per_token: 1.0e-05
- model_name: claude-opus-5-5
  litellm_params:
    model: anthropic/claude-opus-5-5
    api_key: os.environ/ANTHROPIC_API_KEY
    # Thinking cannot be disabled. The default display streams empty thinking
    # blocks, which the app's first-content watchdog cannot tell from a stall;
    # summaries arrive as reasoning deltas. Display does not change billing.
    # Effort is sent by the app inside output_config (see text_models.py).
    thinking:
      type: adaptive
      display: summarized
  # The bundled map lacks the 5.5 models.
  model_info:
    mode: chat
    supports_output_config: true
    supports_native_structured_output: true
    supports_adaptive_thinking: true
    supports_reasoning: true
    supports_vision: true
    supports_sampling_params: false
    supports_assistant_prefill: false
    max_input_tokens: 1000000
    max_output_tokens: 128000
    input_cost_per_token: 4.0e-06
    output_cost_per_token: 2.0e-05
    cache_read_input_token_cost: 2.0e-07
    cache_creation_input_token_cost: 5.0e-06
- model_name: claude-sonnet-5-5
  litellm_params:
    model: anthropic/claude-sonnet-5-5
    api_key: os.environ/ANTHROPIC_API_KEY
