model_list:
  # ─── Stage 1: full-novel extraction ───────────────────────────────────────
  - model_name: extract-fast
    litellm_params:
      model: vertex_ai/gemini-3.1-flash-lite-preview
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
      # Canary adapts public-domain literature (Grimm, Lovecraft, …) whose
      # canonical content includes violence. Vertex's default filters
      # (BLOCK_MEDIUM_AND_ABOVE) return empty candidates on such passages,
      # which surface as "Empty response from LiteLLM" and degrade the
      # pipeline. Disable filtering for these text models; the gateway is
      # internal and outputs are reviewed downstream.
      safety_settings: &vertex_safety_off
        - category: HARM_CATEGORY_HARASSMENT
          threshold: "OFF"
        - category: HARM_CATEGORY_HATE_SPEECH
          threshold: "OFF"
        - category: HARM_CATEGORY_SEXUALLY_EXPLICIT
          threshold: "OFF"
        - category: HARM_CATEGORY_DANGEROUS_CONTENT
          threshold: "OFF"
  - model_name: extract-balanced
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
      safety_settings: *vertex_safety_off
  - model_name: extract-quality
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
      safety_settings: *vertex_safety_off

  # ─── Stage 3: screenplay / dialogue adaptation ────────────────────────────
  - model_name: screenplay-fast
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: screenplay-balanced
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: screenplay-quality
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  # ─── Stage 4: layout / panel planning ─────────────────────────────────────
  - model_name: panel-fast
    litellm_params:
      model: vertex_ai/gemini-3.1-flash-lite-preview
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
      safety_settings: *vertex_safety_off
  - model_name: panel-balanced
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
      safety_settings: *vertex_safety_off
  # Panel planning is templated reasoning over already-extracted data; Gemini
  # 3.5 Flash validates the layout JSON reliably at ~6x less than gpt-5.4.
  - model_name: panel-quality
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
      safety_settings: *vertex_safety_off

  # ─── Stage 5: image-prompt assembly (template filling) ────────────────────
  # Prompt assembly is light rewriting (structured panel spec → prose), but it
  # also powers style suggestions before cast. Keep every prompt tier on the
  # globally available 3.5 Flash route: the 3.1 Flash-Lite preview returns 404
  # for this Vertex project/location. Smoke-test style suggestions after any
  # future model or region change.
  - model_name: prompt-fast
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
      safety_settings: *vertex_safety_off
      reasoning_effort: "disable"
  - model_name: prompt-balanced
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
      safety_settings: *vertex_safety_off
      reasoning_effort: "disable"
  - model_name: prompt-quality
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
      safety_settings: *vertex_safety_off
      reasoning_effort: "disable"

  # ─── Image generation ─────────────────────────────────────────────────────
  - model_name: image-fast
    litellm_params:
      # Nano Banana 2 Lite — fastest/cheapest tier; mirrors image-balanced.
      model: vertex-multimodal/gemini-3.1-flash-lite-image
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
  - model_name: image-balanced
    litellm_params:
      # Nano Banana 2 Lite (Gemini 3.1 Flash Lite Image) — ultra-low latency,
      # ~half the per-image cost of the Pro image model. Routed through the
      # vertex-multimodal custom handler.
      model: vertex-multimodal/gemini-3.1-flash-lite-image
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION
  - model_name: image-balanced-seedream-test
    litellm_params:
      model: fal-queue/bytedance/seedream/v5/lite/edit
      api_key: os.environ/FAL_KEY
  - model_name: image-reve
    litellm_params:
      model: reve/create
      api_key: os.environ/REVE_API_KEY
  - model_name: image-quality
    litellm_params:
      # Seedream 5.0 Pro — production quality tier with up to 10 references.
      # Routed through the fal queue custom handler.
      model: fal-queue/bytedance/seedream/v5/pro/edit
      api_key: os.environ/FAL_KEY

litellm_settings:
  # Langfuse logging happens directly from the Canary AI client (see
  # ai/client.py::_log_langfuse_generation). The built-in LiteLLM callback was
  # removed because it can't reach the image-edit endpoints' prompt/output —
  # that's where "default-message-value" inputs and missing image cost came
  # from on traces.
  set_verbose: false
  num_retries: 3
  retry_after: 2
  drop_params: true
  custom_provider_map:
    - provider: fal-queue
      custom_handler: litellm_handlers.fal_provider.fal_queue_llm
    - provider: vertex-multimodal
      custom_handler: litellm_handlers.vertex_multimodal.vertex_multimodal_llm
    - provider: reve
      custom_handler: litellm_handlers.reve_provider.reve_llm

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
