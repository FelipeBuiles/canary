- model_name: deepseek-v4.1-flash
  litellm_params:
    model: together_ai/deepseek-ai/DeepSeek-V4.1-Flash
    api_key: os.environ/TOGETHER_API_KEY
    # Thinking defaults on and can exhaust Extract's 16k completion budget
    # before any JSON is emitted. LiteLLM 1.101 silently drops
    # reasoning_effort for this unregistered Together model, so send
    # Together's hybrid-reasoning toggle directly.
    extra_body:
      reasoning:
        enabled: false
  # LiteLLM prices Together models by parameter count unless the shared
  # together_ai/<model> entry carries a price; deployment pricing is stripped
  # from that entry, so the id must be that key.
  model_info:
    id: together_ai/deepseek-ai/DeepSeek-V4.1-Flash
    mode: chat
    supports_response_schema: true
    supports_prompt_caching: true
    max_input_tokens: 1048576
    input_cost_per_token: 3.0e-07
    cache_read_input_token_cost: 6.0e-09
    output_cost_per_token: 1.2e-06
- model_name: image-sunburst
  litellm_params:
    model: fal-queue/openai/gpt-image-2.5/sunburst
    api_key: os.environ/FAL_KEY
# Sunburst direct on OpenAI, streamed so failures carry their phase. New Draw
# editions try this route first and fall back to image-sunburst (FAL).
- model_name: image-sunburst-openai
  litellm_params:
    model: openai-stream/gpt-image-2.5-sunburst
    api_key: os.environ/OPENAI_API_KEY
# Labs comparison route; uses the same OpenAI transport and credentials.
- model_name: image-flare
  litellm_params:
    model: openai-stream/gpt-image-2.5-flare
    api_key: os.environ/OPENAI_API_KEY
# GPT Image 2.5 through Runware (startup grant). References go by uploaded
# media UUID; Runware reports each task's charged cost. No partial previews.
- model_name: image-sunburst-runware
  litellm_params:
    model: runware/gpt-image-2.5-sunburst
    api_key: os.environ/RUNWARE_API_KEY
- model_name: image-flare-runware
  litellm_params:
    model: runware/gpt-image-2.5-flare
    api_key: os.environ/RUNWARE_API_KEY
# Style/Cast, Draw, and Labs image generation, using the existing Vertex ADC.
- model_name: image-nano-banana-2.1
  litellm_params:
    model: vertex-multimodal/gemini-nano-banana-2.1
    # LiteLLM reserves vertex_* settings for its built-in adapter and strips
    # them from custom image generation. These names reach the native handler.
    project: os.environ/VERTEXAI_PROJECT
    location: global
    canary_image_pricing:
      input_cost_per_token: 1.5e-06
      cached_input_cost_per_token: 1.5e-07
      text_output_cost_per_token: 7.5e-06
      image_output_cost_per_token: 3.0e-05
  model_info:
    mode: image_generation
- model_name: ocr-textract
  litellm_params:
    model: textract/detect-document-text
  model_info:
    mode: chat
litellm_settings:
  set_verbose: false
  num_retries: 0
  callbacks:
  - canary_metrics_callback.metrics_callback
  # Unsupported parameters fail the request instead of vanishing from it.
  drop_params: false
  custom_provider_map:
  - provider: vertex-multimodal
    custom_handler: litellm_handlers.vertex_multimodal.vertex_multimodal_llm
  - provider: fal-queue
    custom_handler: litellm_handlers.fal_provider.fal_queue_llm
  - provider: openai-stream
    custom_handler: litellm_handlers.openai_image_stream.openai_image_stream_llm
  - provider: textract
    custom_handler: litellm_handlers.textract.textract_llm
  - provider: runware
    custom_handler: litellm_handlers.runware_provider.runware_image_llm
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
