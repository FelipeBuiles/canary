model_list:
  - model_name: canary/extract
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION

  - model_name: canary/screenplay
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: canary/panel
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: canary/prompt
    litellm_params:
      model: vertex_ai/gemini-3.1-flash-lite-preview
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION

  - model_name: canary/image-primary
    litellm_params:
      model: openai/gpt-image-2
      api_key: os.environ/OPENAI_API_KEY

  - model_name: canary/image-fallback
    litellm_params:
      model: vertex_ai/gemini-3-pro-image-preview
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION

  - model_name: canary/image-fast
    litellm_params:
      model: vertex_ai/gemini-3.1-flash-image-preview
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: os.environ/VERTEXAI_LOCATION

litellm_settings:
  # Langfuse logging happens directly from the Canary AI client (see
  # ai/client.py::_log_langfuse_generation). The built-in LiteLLM callback was
  # removed because it can't reach the image-edit endpoints' prompt/output —
  # that's where "default-message-value" inputs and missing image cost came
  # from on traces.
  set_verbose: false
  num_retries: 3
  retry_after: 2
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
