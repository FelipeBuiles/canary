# Production gateway allowlist. Development Codex requests bypass this proxy.
model_list:
- model_name: gpt-6-sol
  litellm_params:
    model: openai/gpt-6-sol
    api_key: os.environ/OPENAI_API_KEY
    reasoning_effort: low
- model_name: gpt-6-luna
  litellm_params:
    model: openai/gpt-6-luna
    api_key: os.environ/OPENAI_API_KEY
    reasoning_effort: low
- model_name: claude-fable-5-1
  litellm_params:
    model: anthropic/claude-fable-5-1
    api_key: os.environ/ANTHROPIC_API_KEY
    thinking:
      type: adaptive
- model_name: claude-opus-5-5
  litellm_params:
    model: anthropic/claude-opus-5-5
    api_key: os.environ/ANTHROPIC_API_KEY
    # Thinking cannot be disabled. The default display streams empty thinking
    # blocks, which the app's first-content watchdog cannot tell from a stall;
    # summaries arrive as reasoning deltas. Display does not change billing.
    # Effort is sent by the app inside output_config (see text_models.py).
    thinking:
      type: adaptive
      display: summarized
- model_name: mimo-v2.6-pro
  litellm_params:
    model: openrouter/xiaomi/mimo-v2.6-pro
    api_key: os.environ/OPENROUTER_API_KEY
    reasoning_effort: none
    extra_body:
      reasoning:
        enabled: false
      provider:
        require_parameters: true
- model_name: deepseek-v4.1-flash
  litellm_params:
    model: together_ai/deepseek-ai/DeepSeek-V4.1-Flash
    api_key: os.environ/TOGETHER_API_KEY
    # Thinking defaults on and can exhaust Extract's 16k completion budget
    # before any JSON is emitted. LiteLLM 1.101 silently drops
    # reasoning_effort for this unregistered Together model, so send
    # Together's hybrid-reasoning toggle directly.
    extra_body:
      reasoning:
        enabled: false
- model_name: image-sunburst
  litellm_params:
    model: fal-queue/openai/gpt-image-2.5/sunburst
    api_key: os.environ/FAL_KEY
litellm_settings:
  set_verbose: false
  num_retries: 0
  drop_params: true
  custom_provider_map:
  - provider: fal-queue
    custom_handler: litellm_handlers.fal_provider.fal_queue_llm
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
