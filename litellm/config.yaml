# Concrete model routes. No automatic model upgrades or provider retries.
model_list:
- model_name: gpt-5.6-terra
  litellm_params:
    model: openai/gpt-5.6-terra
    api_key: os.environ/OPENAI_API_KEY
    reasoning_effort: low
- model_name: gpt-5.6-luna
  litellm_params:
    model: openai/gpt-5.6-luna
    api_key: os.environ/OPENAI_API_KEY
    reasoning_effort: low
- model_name: gemini-3.8-flash
  litellm_params:
    model: vertex_ai/gemini-3.8-flash
    vertex_project: os.environ/VERTEXAI_PROJECT
    vertex_location: os.environ/VERTEXAI_LOCATION
    safety_settings:
    - category: HARM_CATEGORY_HARASSMENT
      threshold: 'OFF'
    - category: HARM_CATEGORY_HATE_SPEECH
      threshold: 'OFF'
    - category: HARM_CATEGORY_SEXUALLY_EXPLICIT
      threshold: 'OFF'
    - category: HARM_CATEGORY_DANGEROUS_CONTENT
      threshold: 'OFF'
    reasoning_effort: low
- model_name: deepseek-v4.1-flash
  litellm_params:
    model: openrouter/deepseek/deepseek-v4.1-flash
    api_key: os.environ/OPENROUTER_API_KEY
    reasoning_effort: none
    extra_body:
      reasoning:
        enabled: false
      provider:
        require_parameters: true
- model_name: glm-5.3-flash
  litellm_params:
    model: openrouter/z-ai/glm-5.3-flash
    api_key: os.environ/OPENROUTER_API_KEY
    reasoning_effort: low
    extra_body:
      provider:
        require_parameters: true
- model_name: image-gemini-flash-lite
  litellm_params:
    model: vertex-multimodal/gemini-3.1-flash-lite-image
    vertex_project: os.environ/VERTEXAI_PROJECT
    vertex_location: os.environ/VERTEXAI_LOCATION
- model_name: image-gemini-pro
  litellm_params:
    model: vertex-multimodal/gemini-3-pro-image
    vertex_project: os.environ/VERTEXAI_PROJECT
    vertex_location: os.environ/VERTEXAI_LOCATION
- model_name: image-gpt-2
  litellm_params:
    model: openai/gpt-image-2
    api_key: os.environ/OPENAI_API_KEY
- model_name: image-seedream-v5-lite
  litellm_params:
    model: fal-queue/bytedance/seedream/v5/lite/edit
    api_key: os.environ/FAL_KEY
- model_name: image-sunburst
  litellm_params:
    model: openai/gpt-image-2.5-sunburst
    api_key: os.environ/OPENAI_API_KEY
- model_name: image-flare
  litellm_params:
    model: openai/gpt-image-2.5-flare
    api_key: os.environ/OPENAI_API_KEY
- model_name: image-muse
  litellm_params:
    model: openrouter/meta/muse-image
    api_key: os.environ/OPENROUTER_API_KEY
litellm_settings:
  set_verbose: false
  num_retries: 0
  drop_params: true
  custom_provider_map:
  - provider: fal-queue
    custom_handler: litellm_handlers.fal_provider.fal_queue_llm
  - provider: vertex-multimodal
    custom_handler: litellm_handlers.vertex_multimodal.vertex_multimodal_llm
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
