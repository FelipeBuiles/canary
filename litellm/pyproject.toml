[project]
name = "canary-gateway"
version = "0.1.0"
description = "Isolated, shared dependency environment for both Canary gateways"
requires-python = ">=3.12,<3.13"
dependencies = [
  "litellm[proxy]==1.101.0",
  # The PyPI proxy extra omits the database runtime bundled upstream.
  "prisma>=0.11.0,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "google-cloud-aiplatform==2.1.3",
  "google-auth==2.58.0",
  "google-genai==2.24.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]

[tool.uv]
package = false
