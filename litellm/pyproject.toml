[project]
name = "canary-gateway"
version = "0.1.0"
description = "Isolated, shared dependency environment for both Canary gateways"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-auth>=2.48,<3",
  "litellm[proxy]==1.101.0",
  # The PyPI proxy extra omits the database runtime bundled upstream.
  "posthog>=7.60.1",
  "prisma>=0.11.0,<1.0",
  "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]

[tool.uv]
package = false
