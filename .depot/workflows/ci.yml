name: Depot CI

# Test + build gate. Every PR and push to main must pass before merge or deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # optional release rerun or offline recovery
    inputs:
      skip_drain:
        description: "Offline recovery only: skip drain because production machines are stopped"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Release runs have unique groups; only superseded PR checks are cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep working-directory on individual steps: Depot's injected local-patch step
# must run at the repository root so it applies changes outside each package.
jobs:
  backend:
    name: Backend (pytest shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on:
      size: 2x8
      image: 6ntrqswcbt.registry.depot.dev/canary-ci:py312-node24.21-pw1.63-v1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: novel_to_comic/uv.lock
      - name: Sync dependencies
        working-directory: novel_to_comic
        # The web extra includes production telemetry integrations.
        run: uv sync --locked --extra web --extra dev
      - name: Check locked production dependencies
        working-directory: novel_to_comic
        if: matrix.shard == 0
        run: python ../scripts/check_release.py audit-app
      - name: Install Playwright Chromium
        working-directory: novel_to_comic
        run: bash ../scripts/ci_install_browser.sh
      - name: Documentation reliability
        if: matrix.shard == 0
        working-directory: .
        run: python scripts/check_docs_reliability.py
      - name: Ruff
        working-directory: novel_to_comic
        if: matrix.shard == 0
        run: uv run ruff check .
      - uses: depot/setup-action@v1
      # Candidates are relative to cwd; report paths are relative to GITHUB_WORKSPACE.
      - name: Pytest shard
        working-directory: novel_to_comic
        run: >-
          depot tests run
          --candidates-command "rg --files tests -g 'test_*.py' -g '*_test.py' | sort"
          --candidate-type filename
          --timings-type filename
          --split-key canary-backend-py312
          --index ${{ matrix.shard }} --total 4
          --command "xargs -r uv run python ../scripts/run_backend_checks.py -q --durations=5 -o junit_family=xunit1 --junitxml=reports/pytest.xml"
          --report-path novel_to_comic/reports/pytest.xml

  web:
    name: Web (vitest + build)
    runs-on:
      size: 8x32
      image: 6ntrqswcbt.registry.depot.dev/canary-ci:py312-node24.21-pw1.63-v1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies and validate peers
        working-directory: web
        run: |
          npm ci
          npm ls --all
      - name: Dependency audits
        working-directory: web
        # No advisory allowlist: fail closed on production or tooling findings.
        run: |
          npm run audit:production
          npm audit --audit-level=high
      - name: Vitest
        working-directory: web
        # Import-time Supabase validation requires non-secret placeholders.
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
        run: npm run test
      - name: ESLint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build

  docker:
    # Main releases build the production image instead of a second smoke image.
    if: github.event_name == 'pull_request'
    name: Docker image (build smoke test)
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    # Build production end-to-end without publishing or deploying an image.
    steps:
      - uses: actions/checkout@v7
      - name: Set up Depot builder
        uses: depot/setup-action@v1
      - name: Prepare build metadata
        id: build_meta
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: depot/build-push-action@v1
        with:
          project: js338b6zll
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            CANARY_VERSION=${{ github.sha }}
            CANARY_BUILD_TIMESTAMP=${{ steps.build_meta.outputs.timestamp }}
            VITE_SUPABASE_URL=https://ci-smoke.supabase.co
            VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_smoke
            VITE_CANARY_ENV=production

  gateway:
    name: Gateway dependency contracts
    runs-on:
      size: 2x8
      image: 6ntrqswcbt.registry.depot.dev/canary-ci:py312-node24.21-pw1.63-v1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: litellm/uv.lock
      - name: Install the shared gateway lock
        run: |
          uv sync --project litellm --locked
          uv pip check --python litellm/.venv/bin/python
      - name: Check real SDK and patched provider behavior
        run: |
          litellm/.venv/bin/python litellm/patch_http_errors.py
          litellm/.venv/bin/python litellm/patch_anthropic_refusals.py
          litellm/.venv/bin/python -m pytest litellm/tests -q
      - uses: depot/setup-action@v1
      - name: Build the gateway image
        run: depot build --project js338b6zll --load -f litellm/Dockerfile -t canary-gateway-ci .
      - name: Verify database-free and PostgreSQL-backed gateway startup
        run: python scripts/smoke_gateway.py canary-gateway-ci
      - name: Check locked production dependencies
        run: python scripts/check_release.py audit-gateway

  tooling:
    name: Root tooling
    runs-on:
      size: 2x8
      image: 6ntrqswcbt.registry.depot.dev/canary-ci:py312-node24.21-pw1.63-v1
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Root tooling
        run: |
          npm ci
          npm ls --all
          npm audit --audit-level=high

  database:
    name: PostgreSQL authorization and ledger
    runs-on:
      size: 2x8
      image: 6ntrqswcbt.registry.depot.dev/canary-ci:py312-node24.21-pw1.63-v1
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d canary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CREDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canary_test
      CANARY_DISPOSABLE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: novel_to_comic/uv.lock
      - name: Install dependencies
        working-directory: novel_to_comic
        run: uv sync --frozen --extra web --extra dev
      - name: Install browser for paid-action integration tests
        working-directory: novel_to_comic
        run: bash ../scripts/ci_install_browser.sh
      - name: Existing and new billing/security regressions
        working-directory: novel_to_comic
        # Keep money/security checks independently visible; this does not
        # replace or relax the normal whole-repository lint/test/build gates.
        # PostgreSQL contracts run after schema bootstrap, below.
        run: >-
          uv run python ../scripts/run_backend_checks.py -q
          --ignore-glob='tests/*_postgres.py'
          -k "billing or refund or checkout or credit or auth or security_boundary"
      - name: Install disposable database client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Exercise real ledger transactions and browser roles
        # Shared bootstrap, migration replay and complete database contracts.
        run: python scripts/check_release.py database

  release_image:
    name: Build production image
    environment: production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: registry.fly.io/canary-web@${{ steps.image.outputs.digest }}
      digest: ${{ steps.image.outputs.digest }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment configuration
        env:
          CANARY_OPS_TOKEN: ${{ secrets.CANARY_OPS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=()
          for name in FLY_API_TOKEN CANARY_OPS_TOKEN VITE_SUPABASE_URL \
            VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing production secrets: ${missing[*]}"
            exit 1
          fi
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.104
      - name: Prepare release metadata
        id: release
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "image=registry.fly.io/canary-web:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Set up Depot builder
        uses: depot/setup-action@v1
      - name: Authenticate to the Fly registry
        run: flyctl auth docker
      # Build before draining so customers are not blocked during the build.
      # The pushed image is the exact artifact deployed and rolled back to.
      - name: Build and push release image
        id: image
        uses: depot/build-push-action@v1
        with:
          project: js338b6zll
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.release.outputs.image }}
          build-args: |
            CANARY_VERSION=${{ github.sha }}
            CANARY_BUILD_TIMESTAMP=${{ steps.release.outputs.timestamp }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_POSTHOG_PROJECT_TOKEN=${{ secrets.POSTHOG_PROJECT_TOKEN }}
            VITE_POSTHOG_HOST=${{ vars.POSTHOG_HOST }}
            POSTHOG_PROJECT_ID=${{ vars.POSTHOG_PROJECT_ID }}
            VITE_CANARY_ENV=production
          secrets: |
            POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
      - name: Smoke test release image
        env:
          IMAGE: registry.fly.io/canary-web@${{ steps.image.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint /app/novel_to_comic/.venv/bin/python "$IMAGE" \
            -c "import novel_to_comic.server.app, novel_to_comic.server.durable_queue"
          # The patched proxy and config callbacks import /app modules; plain
          # `import litellm` would not load them.
          docker run --rm --entrypoint /app/.venv-litellm/bin/python "$IMAGE" \
            -c "import litellm.proxy.proxy_server, canary_metrics_callback"

  deploy:
    name: Deploy production
    environment: production
    needs: [backend, web, gateway, tooling, database, release_image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: production-deploy
      cancel-in-progress: false
      queue: max
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.104
      - name: Drain production and wait for running work
        if: ${{ !inputs.skip_drain }}
        env:
          CANARY_OPS_TOKEN: ${{ secrets.CANARY_OPS_TOKEN }}
          # Direct Fly route, still protected by CANARY_OPS_TOKEN.
          SCENEWRIGHT_APP_URL: https://canary-web.fly.dev
        run: python scripts/check_deploy_safe.py
      - name: Record offline recovery
        if: ${{ inputs.skip_drain }}
        run: echo 'Offline recovery requested by operator; deployment drain skipped because production machines are stopped.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record rollback target
        env:
          IMAGE: ${{ needs.release_image.outputs.image }}
          DIGEST: ${{ needs.release_image.outputs.digest }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Release image: \`${IMAGE}\` (\`${DIGEST}\`)"
            echo "- Roll back with \`flyctl deploy -a canary-web --image <previous image>\`. Previous releases:"
            echo '```'
            flyctl releases -a canary-web --image | head -n 3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy exact release image
        env:
          IMAGE: ${{ needs.release_image.outputs.image }}
        run: flyctl deploy -a canary-web --image "$IMAGE"
      - name: Verify deployed release
        env:
          EXPECTED_CANARY_VERSION: ${{ github.sha }}
          SCENEWRIGHT_APP_URL: https://scenewright.ink
          CANARY_OPS_TOKEN: ${{ secrets.CANARY_OPS_TOKEN }}
        run: python scripts/verify_deployment.py --resume
      - name: Record deployed release
        if: success()
        run: |
          {
            echo
            echo "- Deployment verification: passed"
            echo "- Public URL: https://scenewright.ink"
          } >> "$GITHUB_STEP_SUMMARY"
