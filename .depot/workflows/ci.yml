name: Depot CI

# Test + build gate. Every PR and push to main must pass before merge or deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # rerun a normal release; initial cutover is operator-managed

permissions:
  contents: read

# Release runs have unique groups; only superseded PR checks are cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep working-directory on individual steps: Depot's injected local-patch step
# must run at the repository root so it applies changes outside each package.
jobs:
  backend:
    name: Backend (pytest shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on:
      size: 2x8
      image: 6ntrqswcbt.registry.depot.dev/canary-ci:py312-node24.21-pw1.63-v1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: novel_to_comic/uv.lock
      - name: Sync dependencies
        working-directory: novel_to_comic
        # The web extra includes production telemetry integrations.
        run: uv sync --locked --extra web --extra dev
      - name: Check locked production dependencies
        working-directory: novel_to_comic
        if: matrix.shard == 0
        run: python ../scripts/check_release.py audit-app
      - name: Install Playwright Chromium
        working-directory: novel_to_comic
        run: bash ../scripts/ci_install_browser.sh
      - name: Documentation reliability
        if: matrix.shard == 0
        working-directory: .
        run: python scripts/check_docs_reliability.py
      - name: Ruff
        working-directory: novel_to_comic
        if: matrix.shard == 0
        run: uv run ruff check .
      - uses: depot/setup-action@v1
      # Candidates are relative to cwd; report paths are relative to GITHUB_WORKSPACE.
      - name: Pytest shard
        working-directory: novel_to_comic
        run: >-
          depot tests run
          --candidates-command "rg --files tests -g 'test_*.py' -g '*_test.py' | sort"
          --candidate-type filename
          --timings-type filename
          --split-key canary-backend-py312
          --index ${{ matrix.shard }} --total 4
          --command "xargs -r uv run python ../scripts/run_backend_checks.py -q --durations=5 -o junit_family=xunit1 --junitxml=reports/pytest.xml"
          --report-path novel_to_comic/reports/pytest.xml

  web:
    name: Web (build + contracts + vitest)
    runs-on:
      size: 8x32
      image: 6ntrqswcbt.registry.depot.dev/canary-ci:py312-node24.21-pw1.63-v1
    timeout-minutes: 30
    # Tests and public-page prerendering validate Supabase config at import time.
    env:
      VITE_SUPABASE_URL: https://ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies and validate peers
        working-directory: web
        run: |
          npm ci
          npm ls --all
      - name: Dependency audits
        working-directory: web
        # No advisory allowlist: fail closed on production or tooling findings.
        run: |
          npm run audit:production
          npm audit --audit-level=high
      - name: ESLint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build
      - name: Set up Python for built-page contracts
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: novel_to_comic/uv.lock
      - name: Check built public pages and application mounts
        run: python scripts/check_release.py web-contracts
      - name: Vitest including production hydration
        working-directory: web
        run: npm run test

  docker:
    # Main releases build the production image instead of a second smoke image.
    if: github.event_name == 'pull_request'
    name: Docker image (build smoke test)
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    # Build production end-to-end without publishing or deploying an image.
    steps:
      - uses: actions/checkout@v7
      - name: Set up Depot builder
        uses: depot/setup-action@v1
      - name: Prepare build metadata
        id: build_meta
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: depot/build-push-action@v1
        with:
          project: js338b6zll
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            CANARY_VERSION=${{ github.sha }}
            CANARY_BUILD_TIMESTAMP=${{ steps.build_meta.outputs.timestamp }}
            VITE_SUPABASE_URL=https://ci-smoke.supabase.co
            VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_smoke
            VITE_CANARY_ENV=production

  gateway:
    name: Gateway dependency contracts
    runs-on:
      size: 2x8
      image: 6ntrqswcbt.registry.depot.dev/canary-ci:py312-node24.21-pw1.63-v1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: litellm/uv.lock
      - name: Install the shared gateway lock
        run: |
          uv sync --project litellm --locked
          uv pip check --python litellm/.venv/bin/python
      - name: Check real SDK and patched provider behavior
        run: |
          litellm/.venv/bin/python litellm/patch_http_errors.py
          litellm/.venv/bin/python litellm/patch_anthropic_refusals.py
          litellm/.venv/bin/python litellm/patch_model_response.py
          litellm/.venv/bin/python -m pytest litellm/tests -q
      - uses: depot/setup-action@v1
      - name: Build the gateway image
        run: depot build --project js338b6zll --load -f litellm/Dockerfile -t canary-gateway-ci .
      - name: Verify database-free and PostgreSQL-backed gateway startup
        run: python scripts/smoke_gateway.py canary-gateway-ci
      - name: Check locked production dependencies
        run: python scripts/check_release.py audit-gateway

  tooling:
    name: Root tooling
    runs-on:
      size: 2x8
      image: 6ntrqswcbt.registry.depot.dev/canary-ci:py312-node24.21-pw1.63-v1
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Root tooling
        run: |
          npm ci
          npm ls --all
          npm audit --audit-level=high

  database:
    name: PostgreSQL authorization and ledger
    runs-on:
      size: 2x8
      image: 6ntrqswcbt.registry.depot.dev/canary-ci:py312-node24.21-pw1.63-v1
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d canary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CREDIT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canary_test
      CANARY_DISPOSABLE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: novel_to_comic/uv.lock
      - name: Install dependencies
        working-directory: novel_to_comic
        run: uv sync --frozen --extra web --extra dev
      - name: Install disposable database client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Exercise real ledger transactions and browser roles
        # Shared bootstrap, migration replay and complete database contracts.
        run: python scripts/check_release.py database

  release_image:
    name: Build production image
    environment: production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: registry.depot.dev/js338b6zll@${{ steps.image.outputs.digest }}
      loader_sha256: ${{ steps.release.outputs.loader_sha256 }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=()
          for name in VITE_SUPABASE_URL \
            VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing production secrets: ${missing[*]}"
            exit 1
          fi
      - name: Prepare release metadata
        id: release
        run: |
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "loader_sha256=$(sha256sum scripts/canary_secrets.py | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Set up Depot builder
        uses: depot/setup-action@v1
      # Build before draining so customers are not blocked during the build.
      # The pushed image is the exact artifact deployed and rolled back to.
      - name: Build and push release image
        id: image
        uses: depot/build-push-action@v1
        with:
          project: js338b6zll
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          save: true
          save-tags: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            CANARY_VERSION=${{ github.sha }}
            CANARY_BUILD_TIMESTAMP=${{ steps.release.outputs.timestamp }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_POSTHOG_PROJECT_TOKEN=${{ secrets.POSTHOG_PROJECT_TOKEN }}
            VITE_POSTHOG_HOST=${{ vars.POSTHOG_HOST }}
            VITE_GA4_MEASUREMENT_ID=G-R9Q5LX1E00
            POSTHOG_PROJECT_ID=${{ vars.POSTHOG_PROJECT_ID }}
            VITE_CANARY_ENV=production
          secrets: |
            POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
      - name: Smoke test release image
        env:
          IMAGE: registry.depot.dev/js338b6zll@${{ steps.image.outputs.digest }}
          LOADER_SHA256: ${{ steps.release.outputs.loader_sha256 }}
        run: |
          depot pull-token --project js338b6zll | docker login registry.depot.dev -u x-token --password-stdin
          docker pull "$IMAGE"
          actual=$(docker run --rm --network none --entrypoint sha256sum "$IMAGE" /app/canary_secrets.py | cut -d ' ' -f 1)
          test "$actual" = "$LOADER_SHA256"
          docker run --rm --entrypoint /app/novel_to_comic/.venv/bin/python "$IMAGE" \
            -c "import novel_to_comic.server.app, novel_to_comic.server.durable_queue"
          # The patched proxy and config callbacks import /app modules; plain
          # `import litellm` would not load them.
          docker run --rm --entrypoint /app/.venv-litellm/bin/python "$IMAGE" \
            -c "import litellm.proxy.proxy_server, canary_metrics_callback"

  deploy:
    name: Deploy production to Lightsail
    environment: production
    needs: [backend, web, gateway, tooling, database, release_image]
    # Enable only after the operator has fenced Fly and completed the first cutover.
    if: vars.CANARY_DEPLOY_TARGET == 'lightsail' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: depot/setup-action@v1
      - name: Reject superseded release
        # Tests/builds can finish out of order; never replace a newer release
        # with an older main commit that reached the deployment queue later.
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Obtain scoped AWS firewall access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LIGHTSAIL_CI_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600
      - name: Deploy exact release image
        env:
          CANARY_RELEASE_IMAGE: ${{ needs.release_image.outputs.image }}
          CANARY_RELEASE_VERSION: ${{ github.sha }}
          CANARY_LOADER_SHA256: ${{ needs.release_image.outputs.loader_sha256 }}
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ vars.LIGHTSAIL_SSH_KNOWN_HOSTS }}
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
        run: python3 scripts/deploy_lightsail.py
      - name: Record deployed release
        if: success()
        env:
          IMAGE: ${{ needs.release_image.outputs.image }}
        run: |
          {
            echo "Lightsail release verified and admission resumed."
            echo "Source: $GITHUB_SHA"
            echo "Image: $IMAGE"
            echo "Public URL: https://scenewright.ink"
          } >> "$GITHUB_STEP_SUMMARY"
