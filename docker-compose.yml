services:
  queue-db:
    image: docker.io/postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: canary
      POSTGRES_PASSWORD: ${CANARY_QUEUE_PASSWORD:-canary-local}
      POSTGRES_DB: canary_queue
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - canary_queue_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canary -d canary_queue"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ─── Prod-parity image (opt-in via `--profile prod`) ─────────────────────
  # Builds the merged Dockerfile (uvicorn + LiteLLM proxy in one container,
  # loopback at 127.0.0.1:4000) so you can smoke-test the exact Fly artifact
  # before deploying.
  #
  # Run:       docker compose --profile prod up canary-prod
  # Rebuild:   docker compose --profile prod build canary-prod
  # Stop:      Ctrl+C, then `docker compose down` (preserves database volumes)
  #
  # Frontend build args are inlined at build time (the browser talks to
  # Supabase directly). For a local smoke test, the placeholder values below
  # are fine — the bundle compiles, you just won't be able to log in. To
  # exercise auth, set VITE_SUPABASE_URL + VITE_SUPABASE_PUBLISHABLE_KEY in
  # your env before `up --build`.
  canary-prod:
    depends_on:
      queue-db:
        condition: service_healthy
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://local-smoke.supabase.co}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_local_smoke}
        VITE_CANARY_ENV: ${VITE_CANARY_ENV:-development}
        CANARY_VERSION: ${CANARY_VERSION:-local}
        VITE_POSTHOG_PROJECT_TOKEN: ${VITE_POSTHOG_PROJECT_TOKEN:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
        POSTHOG_PROJECT_ID: ${POSTHOG_PROJECT_ID:-}
      secrets:
        - POSTHOG_API_KEY
    ports:
      - "8000:8000"
    environment:
      # ─── LiteLLM proxy (loopback) ────────────────────────────────────────
      # LITELLM_BASE_URL points at 127.0.0.1 because the proxy is a subprocess
      # inside this same container, not the sibling `litellm` service.
      LITELLM_BASE_URL: http://127.0.0.1:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-canary}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-replace-with-local-dev-secret}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-local-canary}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      FAL_KEY: ${FAL_KEY:-}
      FAL_ADMIN_KEY: ${FAL_ADMIN_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      VERTEXAI_PROJECT: ${VERTEXAI_PROJECT:-}
      VERTEXAI_LOCATION: ${VERTEXAI_LOCATION:-global}
      # ─── Web app ─────────────────────────────────────────────────────────
      CANARY_ENV: ${CANARY_ENV:-development}
      CANARY_VERSION: ${CANARY_VERSION:-local}
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      POSTHOG_TRACE_SAMPLE_RATE: ${POSTHOG_TRACE_SAMPLE_RATE:-1}
      CANARY_LOCAL_DIAGNOSTICS: ${CANARY_LOCAL_DIAGNOSTICS:-false}
      CANARY_AI_CONTENT_CAPTURE: ${CANARY_AI_CONTENT_CAPTURE:-true}
      AI_BILL_FAILED_REQUESTS: ${AI_BILL_FAILED_REQUESTS:-provider_usage_only}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PULP_CREDITS_PER_PROVIDER_USD: ${PULP_CREDITS_PER_PROVIDER_USD:-100}
      PULP_MODEL_COST_MARKUP: ${PULP_MODEL_COST_MARKUP:-1.0}
      PULP_RESERVATION_BUFFER: ${PULP_RESERVATION_BUFFER:-1.25}
      CANARY_GENERATION_WORKERS: ${CANARY_GENERATION_WORKERS:-5}
      CANARY_QUEUE_DATABASE_URL: postgresql://canary:${CANARY_QUEUE_PASSWORD:-canary-local}@queue-db:5432/canary_queue
      CANARY_OPS_TOKEN: ${CANARY_OPS_TOKEN:-local-ops-token}
    volumes:
      - ./projects:/projects
    restart: unless-stopped


  litellm:
    build:
      context: .
      dockerfile: litellm/Dockerfile
    image: canary-litellm:1.101.0
    command: ["--port", "4000", "--config", "/app/config.yaml"]
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-canary}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-replace-with-local-dev-secret}
      # LiteLLM requires a Postgres DB for its key-auth + spend-tracking layer.
      # Without it, user_api_key_auth() raises a ProxyException ("No connected
      # db.") on every request and the gateway 400s before reaching any model.
      # On first boot the proxy auto-creates its tables (Prisma migrations).
      DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://litellm:litellm@litellm-db:5432/litellm}
      STORE_MODEL_IN_DB: "True"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      VERTEXAI_PROJECT: ${VERTEXAI_PROJECT:-}
      VERTEXAI_LOCATION: ${VERTEXAI_LOCATION:-global}
      FAL_KEY: ${FAL_KEY:-}
      FAL_ADMIN_KEY: ${FAL_ADMIN_KEY:-}
      # Gateway metrics share the app's PostHog project; unset disables them.
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      PYTHONPATH: /app:/app/litellm_handlers
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      # Keep callbacks in sync with the mounted config, including older images.
      - ./litellm/canary_metrics.py:/app/canary_metrics.py:ro
      - ./litellm/canary_metrics_callback.py:/app/canary_metrics_callback.py:ro
      - ./litellm_handlers:/app/litellm_handlers:ro
    depends_on:
      litellm-db:
        condition: service_healthy

  # ─── LiteLLM's own Postgres ──────────────────────────────────────────────
  # Dedicated DB for LiteLLM's key-auth + spend-tracking schema. Kept separate
  # from Canary's queue database. The proxy runs its
  # Prisma migrations against this on first boot, so no manual setup is needed.
  litellm-db:
    image: docker.io/postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LITELLM_POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 3s
      timeout: 3s
      retries: 10


volumes:
  canary_queue_data:
  litellm_postgres_data:

# Build-only credential; never mounted into the running application.
secrets:
  POSTHOG_API_KEY:
    environment: POSTHOG_API_KEY
